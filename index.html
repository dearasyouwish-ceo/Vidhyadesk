<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>VidyaDesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#20302A; --panel:#28392F; --panelSoft:#2F423A;
    --chalk:#F1EFE3; --dim:#C9C6B7;
    --yellow:#E8B94A; --blue:#8FB8C9; --rose:#C2547A;
    --line:rgba(241,239,227,0.16);
    --font-display:'Kalam',cursive; --font-body:'Work Sans',system-ui,sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:#111815;font-family:var(--font-body);}
  #root{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;}
  .phone{width:100%;max-width:420px;height:92vh;max-height:820px;background:var(--bg);border-radius:36px;
    border:8px solid #0c100e;box-shadow:0 30px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;position:relative;}
  .notch{display:flex;justify-content:center;padding:10px 0 4px;flex-shrink:0;}
  .notch span{width:80px;height:5px;border-radius:3px;background:rgba(241,239,227,.25);}
  .scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
  .scroll::-webkit-scrollbar{width:6px;}
  .scroll::-webkit-scrollbar-thumb{background:rgba(241,239,227,.25);border-radius:4px;}
  h1,h2{margin:0;font-family:var(--font-display);color:var(--chalk);font-weight:700;}
  p{margin:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 14px;}
  .topbar-left{display:flex;align-items:center;gap:10px;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--chalk);display:flex;padding:0;}
  .icon-btn:active{transform:scale(.92);}
  .logout-btn{background:none;border:none;cursor:pointer;color:var(--dim);font-family:var(--font-body);font-size:12px;display:flex;align-items:center;gap:4px;}
  .px6{padding-left:24px;padding-right:24px;}
  .px5{padding-left:20px;padding-right:20px;}
  .btn{border:none;border-radius:16px;padding:14px;font-family:var(--font-body);font-weight:600;font-size:16px;cursor:pointer;width:100%;}
  .btn:active{transform:scale(.97);}
  .btn-yellow{background:var(--yellow);color:#20302A;}
  .btn-blue{background:var(--blue);color:#20302A;}
  .btn:disabled{opacity:.6;}
  .input{background:var(--bg);border:1.5px solid var(--line);color:var(--chalk);border-radius:16px;padding:14px;
    font-family:var(--font-body);font-size:15px;width:100%;}
  .input::placeholder{color:var(--dim);opacity:.6;}
  .input:focus{outline:none;border-color:var(--yellow);}
  textarea.input{resize:vertical;min-height:70px;}
  .field-label{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--dim);margin-bottom:8px;display:block;font-family:var(--font-body);}
  .field{margin-bottom:16px;}
  .card{border-radius:20px;padding:18px;margin-bottom:14px;background:var(--panel);text-align:left;cursor:pointer;border:none;width:100%;
    display:flex;align-items:center;gap:12px;}
  .card:active{transform:scale(.98);}
  .card-title{font-size:17px;font-weight:600;color:var(--chalk);font-family:var(--font-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-sub{font-size:12px;font-weight:600;font-family:var(--font-body);margin-top:2px;}
  .card-desc{font-size:13px;color:var(--dim);font-family:var(--font-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .stamp{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed var(--rose);
    color:var(--rose);border-radius:999px;padding:12px 20px;transform:rotate(-6deg);}
  .stamp small{font-size:10px;text-transform:uppercase;letter-spacing:.2em;opacity:.85;font-family:var(--font-body);}
  .stamp b{font-family:var(--font-mono);font-size:18px;letter-spacing:.15em;}
  .tear{height:12px;background-image:radial-gradient(circle at 7px 0, transparent 7px, var(--panel) 7px);
    background-size:14px 12px;background-repeat:repeat-x;}
  .toast{margin:0 20px 12px;border-radius:12px;padding:10px 12px;font-size:13px;display:flex;align-items:center;gap:8px;
    background:rgba(194,84,122,.15);color:var(--rose);font-family:var(--font-body);}
  .empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 32px;gap:6px;color:var(--dim);font-family:var(--font-body);}
  .empty b{color:var(--chalk);font-size:15px;}
  .mat-row{border-radius:16px;padding:12px;margin-bottom:8px;background:var(--panelSoft);display:flex;align-items:center;gap:12px;}
  .mat-icon{border-radius:12px;padding:8px;flex-shrink:0;background:rgba(232,185,74,.15);color:var(--yellow);}
  .mat-icon.blue{background:rgba(143,184,201,.15);color:var(--blue);}
  .type-pill{flex:1;border-radius:12px;padding:8px 4px;text-align:center;font-size:11px;background:var(--panel);color:var(--dim);
    border:1.5px solid transparent;cursor:pointer;font-family:var(--font-body);}
  .type-pill.active{background:rgba(232,185,74,.18);color:var(--yellow);border-color:var(--yellow);}
  .sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;flex-direction:column;justify-content:flex-end;}
  .sheet{background:var(--bg);border-radius:24px 24px 0 0;padding:24px;padding-bottom:32px;max-height:82%;overflow-y:auto;}
  a.download-btn{background:rgba(232,185,74,.18);color:var(--yellow);border-radius:999px;padding:8px;display:flex;flex-shrink:0;text-decoration:none;}
  .link-plain{background:none;border:none;font-size:13px;color:var(--blue);text-decoration:underline;cursor:pointer;font-family:var(--font-body);}
  .danger-link{background:none;border:none;font-size:13px;color:var(--rose);cursor:pointer;font-family:var(--font-body);}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://sanmenwzjcjbudjtdzvr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_KKNQ_eK7s7nfvxDXSqRXLg_v88xBC6c";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let currentUid = null;
let authReady = (async()=>{
  const { data: sessionData } = await sb.auth.getSession();
  if (sessionData && sessionData.session) { currentUid = sessionData.session.user.id; return sessionData.session.user; }
  const { data, error } = await sb.auth.signInAnonymously();
  if (error) throw error;
  currentUid = data.user.id;
  return data.user;
})();

/* ---------------- Supabase cloud storage ---------------- */
let classesCache = [];
function mapClass(r){
  return {
    id:r.id, name:r.name, subject:r.subject, tutorName:r.tutor_name,
    description:r.description || '', code:(r.code || '').toUpperCase(),
    ownerUid:r.owner_uid, ownerKey:r.owner_key || '',
    materials:Array.isArray(r.materials) ? r.materials : [],
    createdAt:Number(r.created_at || 0)
  };
}
async function loadClasses(){
  await authReady;
  const { data, error } = await sb.from('classes').select('*').order('created_at',{ascending:false});
  if(error) throw error;
  classesCache = (data || []).map(mapClass);
  return classesCache;
}
async function saveClass(cls){
  await authReady;
  const row={
    id:cls.id, name:cls.name, subject:cls.subject, tutor_name:cls.tutorName,
    description:cls.description || '', code:cls.code.toUpperCase(),
    owner_uid:cls.ownerUid, owner_key:cls.ownerKey || '',
    materials:cls.materials || [], created_at:cls.createdAt || Date.now()
  };
  const { data, error } = await sb.from('classes').insert(row).select().single();
  if(error) throw error;
  const saved=mapClass(data);
  classesCache = [saved, ...classesCache.filter(c=>c.id!==saved.id)];
  return saved;
}
async function updateClass(id, data){
  await authReady;
  const row={};
  if(Object.prototype.hasOwnProperty.call(data,'materials')) row.materials=data.materials;
  if(Object.prototype.hasOwnProperty.call(data,'description')) row.description=data.description;
  const { data:updated, error } = await sb.from('classes').update(row).eq('id',id).select().single();
  if(error) throw error;
  const mapped=mapClass(updated);
  classesCache = classesCache.map(c=>c.id===id ? mapped : c);
}
async function deleteClassCloud(id){
  await authReady;
  const { error } = await sb.from('classes').delete().eq('id',id);
  if(error) throw error;
  classesCache = classesCache.filter(c=>c.id!==id);
}
async function findClassByCode(code){
  await authReady;
  const normalized=(code||'').trim().toUpperCase();
  const { data, error } = await sb.from('classes').select('*').eq('code',normalized).maybeSingle();
  if(error) throw error;
  return data ? mapClass(data) : null;
}
function sanitizeKey(s){ return (s||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'guest'; }
function loadEnrolled(key){ try{ return JSON.parse(localStorage.getItem('vidyadesk_enrolled_'+key)||'[]'); }catch(e){ return []; } }
function saveEnrolled(key, ids){ localStorage.setItem('vidyadesk_enrolled_'+key, JSON.stringify(ids)); }
function genCode(){ const c='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<6;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
const ACCENTS=['#E8B94A','#8FB8C9','#C2547A'];
function hashAccent(s){ s=s||''; let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%3; return ACCENTS[h]; }
const TYPE_ICONS={ Video:'&#9654;', Notes:'&#128214;', PDF:'&#128196;', Link:'&#128279;' };

/* ---------------- state ---------------- */
let state = {
  role: null, name: '', screen: 'welcome',
  classes: [], enrolled: [], activeId: null, message: '', addingMaterial: false, confirmDeleteClass: false
};

function flash(msg){ state.message = msg; render(); setTimeout(()=>{ state.message=''; render(); }, 4000); }
function myTutorClasses(){ return state.classes.filter(c=>c.ownerUid===currentUid); }
function myStudentClasses(){ return state.classes.filter(c=>state.enrolled.includes(c.id)); }
function activeClass(){ return state.classes.find(c=>c.id===state.activeId) || null; }

/* ---------------- actions ---------------- */
function pickRole(r){ state.role=r; state.screen='name'; render(); }
async function confirmName(){
  const val = document.getElementById('nameInput').value.trim();
  if(!val){ flash('Please enter your name'); return; }
  try{
    await authReady;
    state.name = val;
    if(state.role==='student') state.enrolled = loadEnrolled(sanitizeKey(val));
    state.classes = await loadClasses();
    state.screen = state.role==='tutor' ? 'tutorHome' : 'studentHome';
    render();
  }catch(e){ console.error(e); flash('Supabase connection failed: '+(e.message||e)); }
}
function logout(){ state={role:null,name:'',screen:'welcome',classes:classesCache.slice(),enrolled:[],activeId:null,message:'',addingMaterial:false,confirmDeleteClass:false}; render(); }
function openClass(id, screen){ state.activeId=id; state.screen=screen; state.addingMaterial=false; state.confirmDeleteClass=false; render(); }

async function createClass(){
  const btn=document.getElementById('createClassBtn');
  const nameEl=document.getElementById('cf_name');
  const subjectEl=document.getElementById('cf_subject');
  const tutorEl=document.getElementById('cf_tutor');
  const descEl=document.getElementById('cf_desc');
  const codeEl=document.getElementById('cf_code');
  if(!nameEl||!subjectEl||!tutorEl||!codeEl){ flash('Create form is not ready. Please try again.'); return; }
  const name=nameEl.value.trim(), subject=subjectEl.value.trim(), tutorName=tutorEl.value.trim();
  const description=descEl?descEl.value.trim():'';
  const code=codeEl.textContent.trim().toUpperCase();
  if(!name||!subject||!tutorName){ flash('Class name, subject and tutor name are required'); return; }
  if(btn){btn.disabled=true;btn.textContent='Creating class…';}
  try{
    await authReady;
    if(!currentUid) throw new Error('Anonymous authentication did not complete.');
    const existing=await findClassByCode(code);
    if(existing) throw new Error('This class code already exists. Tap Regenerate and try again.');
    const newClass={id:genId(),name,subject,tutorName,description,code,ownerUid:currentUid,ownerKey:sanitizeKey(state.name),materials:[],createdAt:Date.now()};
    const saved=await saveClass(newClass);
    state.classes=await loadClasses();
    openClass(saved.id,'tutorClass');
  }catch(e){
    console.error('createClass failed',e);
    flash('Could not create class: '+(e.message||e));
    if(btn){btn.disabled=false;btn.textContent='Create class';}
  }
}
function regenCode(){ const el=document.getElementById('cf_code'); if(el) el.textContent=genCode(); }
async function deleteClass(id){
  try{ await deleteClassCloud(id); state.classes=await loadClasses(); state.screen='tutorHome'; render(); }
  catch(e){ console.error(e); flash('Could not delete class: '+(e.message||e)); }
}
async function addMaterial(classId, type){
  const title=document.getElementById('am_title').value.trim();
  const url=document.getElementById('am_url').value.trim();
  const note=document.getElementById('am_note').value.trim();
  if(!title||!url){ flash('Title and link are required'); return; }
  const c=state.classes.find(x=>x.id===classId); if(!c) return;
  const materials=[{id:genId(),type,title,url,note,addedAt:Date.now()}, ...c.materials];
  try{ await updateClass(classId,{materials}); state.classes=await loadClasses(); state.addingMaterial=false; render(); }
  catch(e){ console.error(e); flash('Could not save material: '+(e.message||e)); }
}
async function deleteMaterial(classId, materialId){
  const c=state.classes.find(x=>x.id===classId); if(!c) return;
  const materials=c.materials.filter(m=>m.id!==materialId);
  try{ await updateClass(classId,{materials}); state.classes=await loadClasses(); render(); }
  catch(e){ console.error(e); flash('Could not delete material: '+(e.message||e)); }
}
async function joinClass(){
  const input=document.getElementById('jf_code');
  const code=(input?.value||'').trim().toUpperCase();
  if(!/^[A-Z0-9]{6}$/.test(code)){ flash('Enter the 6-character class code'); return; }
  try{
    const found=await findClassByCode(code);
    if(!found){ flash('No class found with that code'); return; }
    if(!state.enrolled.includes(found.id)){
      state.enrolled=[...state.enrolled,found.id];
      saveEnrolled(sanitizeKey(state.name),state.enrolled);
    }
    state.classes=await loadClasses();
    openClass(found.id,'studentClass');
  }catch(e){ console.error('joinClass failed',e); flash('Could not find class: '+(e.message||e)); }
}
function leaveClass(id){ state.enrolled=state.enrolled.filter(cid=>cid!==id); saveEnrolled(sanitizeKey(state.name),state.enrolled); state.screen='studentHome'; render(); }
function copyCode(code){ navigator.clipboard&&navigator.clipboard.writeText(code).then(()=>flash('Code copied')).catch(()=>flash('Could not copy — copy it manually')); }
let selectedMaterialType='Video';
function selectType(t){ selectedMaterialType=t; render(); }

/* ---------------- screens ---------------- */
function screenWelcome(){
  return `<div class="scroll px6" style="padding-top:32px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
      <span style="color:var(--yellow);font-size:22px;">&#127891;</span>
      <span style="font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:var(--dim);">Tuition made simple</span>
    </div>
    <h1 style="font-size:36px;margin-bottom:8px;">VidyaDesk</h1>
    <p style="font-size:14px;color:var(--dim);margin-bottom:40px;">One roll-call register for every batch — tutors share videos and notes, students grab them the moment they're posted.</p>
    <button class="card" onclick="pickRole('tutor')">
      <div style="flex:1;">
        <div class="card-title">I'm a Tutor</div>
        <div class="card-desc">Create classes, upload videos &amp; notes</div>
      </div>
      <span style="background:rgba(232,185,74,.15);color:var(--yellow);border-radius:999px;padding:10px;">&#128101;</span>
    </button>
    <button class="card" onclick="pickRole('student')">
      <div style="flex:1;">
        <div class="card-title">I'm a Student</div>
        <div class="card-desc">Join with a class code &amp; download</div>
      </div>
      <span style="background:rgba(143,184,201,.15);color:var(--blue);border-radius:999px;padding:10px;">&#128100;</span>
    </button>
    <p style="font-size:11px;text-align:center;color:var(--dim);opacity:.6;margin-top:auto;padding:24px 0;">Works for any subject, any batch — set it up once per class.</p>
  </div>`;
}
function screenName(){
  return `<div class="scroll px6" style="padding-top:16px;">
    ${topbar(state.role==='tutor'?'Tutor sign-in':'Student sign-in', {onBack:"state.screen='welcome';render()"})}
    <p style="font-size:14px;color:var(--dim);margin-bottom:20px;">${state.role==='tutor' ? "Tell us your name — students will see this on your classes." : "Tell us your name so we know which classes are yours."}</p>
    <div class="field"><input id="nameInput" class="input" placeholder="Full name" onkeydown="if(event.key==='Enter')confirmName()"/></div>
    <button class="btn btn-yellow" onclick="confirmName()">Continue</button>
  </div>`;
}
function screenTutorHome(){
  const list = myTutorClasses();
  return `<div class="scroll">
    ${topbar('My Classes',{logout:true})}
    <p class="px6" style="font-size:14px;color:var(--dim);margin-bottom:16px;">Signed in as <span style="color:var(--chalk)">${esc(state.name)}</span></p>
    <div class="px5" style="flex:1;">
      ${list.length===0 ? emptyState('No classes yet','Create your first class to start uploading materials.') : list.map(c=>classCard(c,'tutor')).join('')}
    </div>
    <div class="px5" style="padding-top:20px;padding-bottom:20px;">
      <button class="btn btn-yellow" onclick="state.screen='tutorCreate';render()">&#43; Create new class</button>
    </div>
  </div>`;
}
function screenTutorCreate(){
  const code=genCode();
  return `<div class="scroll px6" style="padding-top:16px;padding-bottom:24px;">
    ${topbar('New class',{onBack:"state.screen='tutorHome';render()"})}
    ${toast()}
    <div class="field"><span class="field-label">Class name</span><input id="cf_name" class="input" placeholder="e.g. Batch A — Evening"/></div>
    <div class="field"><span class="field-label">Subject</span><input id="cf_subject" class="input" placeholder="e.g. Mathematics"/></div>
    <div class="field"><span class="field-label">Tutor name</span><input id="cf_tutor" class="input" value="${esc(state.name)}" placeholder="Your name"/></div>
    <div class="field"><span class="field-label">Description</span><textarea id="cf_desc" class="input" placeholder="What is this class about?"></textarea></div>
    <span class="field-label">Join code (share with students)</span>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
      <div class="stamp"><small>Class code</small><b id="cf_code">${code}</b></div>
      <button class="link-plain" onclick="regenCode()">Regenerate</button>
    </div>
    <button id="createClassBtn" type="button" class="btn btn-yellow" onclick="createClass()">Create class</button>
  </div>`;
}
function screenTutorClass(){
  const c = activeClass(); if(!c) return screenTutorHome();
  const accent = hashAccent(c.subject);
  const materials = c.materials.map(m=>`
    <div class="mat-row">
      <div class="mat-icon">${TYPE_ICONS[m.type]||'&#128196;'}</div>
      <div style="flex:1;min-width:0;">
        <div class="card-title" style="font-size:14px;">${esc(m.title)}</div>
        <div class="card-desc" style="font-size:11px;">${esc(m.type)}${m.note?(' &middot; '+esc(m.note)):''}</div>
      </div>
      <button class="icon-btn" style="color:var(--rose);" onclick="deleteMaterial('${c.id}','${m.id}')">&#128465;</button>
    </div>`).join('');
  return `<div class="scroll" style="position:relative;">
    ${topbar(c.name,{onBack:"state.screen='tutorHome';render()"})}
    <div class="px6">
      <p style="font-size:12px;font-weight:600;color:${accent};margin-bottom:4px;">${esc(c.subject)} &middot; ${esc(c.tutorName)}</p>
      ${c.description?`<p style="font-size:13px;color:var(--dim);margin-bottom:16px;">${esc(c.description)}</p>`:''}
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
        ${stamp(c.code)}
        <button class="link-plain" onclick="copyCode('${c.code}')">Copy code</button>
      </div>
    </div>
    <div class="tear"></div>
    <div class="px5" style="flex:1;padding-top:16px;background:var(--panel);">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <p style="font-size:14px;font-weight:600;color:var(--chalk);">Materials (${c.materials.length})</p>
        <button class="link-plain" style="color:var(--yellow);text-decoration:none;font-weight:600;" onclick="state.addingMaterial=true;render()">&#43; Add</button>
      </div>
      ${c.materials.length===0 ? emptyState('No materials yet','Add your first video, PDF or note.') : materials}
      <div style="height:16px;"></div>
      ${state.confirmDeleteClass ? `
        <div style="background:rgba(194,84,122,.12);border-radius:16px;padding:12px;margin-bottom:24px;">
          <p style="font-size:13px;color:var(--chalk);margin-bottom:8px;">Delete "${esc(c.name)}" and all its materials? This can't be undone.</p>
          <div style="display:flex;gap:16px;">
            <button class="danger-link" style="font-weight:600;" onclick="deleteClass('${c.id}')">Yes, delete</button>
            <button class="link-plain" style="color:var(--dim);" onclick="state.confirmDeleteClass=false;render()">Cancel</button>
          </div>
        </div>` : `<button class="danger-link" style="margin-bottom:24px;" onclick="state.confirmDeleteClass=true;render()">Delete this class</button>`}
    </div>
    ${state.addingMaterial ? addMaterialSheet(c.id) : ''}
  </div>`;
}
function addMaterialSheet(classId){
  const types=['Video','Notes','PDF','Link'];
  return `<div class="sheet-backdrop">
    <div class="sheet">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <h2 style="font-size:20px;">Add material</h2>
        <button class="icon-btn" style="color:var(--dim);" onclick="state.addingMaterial=false;render()">&#10005;</button>
      </div>
      ${toast()}
      <span class="field-label">Type</span>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        ${types.map(t=>`<div class="type-pill ${t===selectedMaterialType?'active':''}" onclick="selectType('${t}')">${TYPE_ICONS[t]}<br/>${t}</div>`).join('')}
      </div>
      <div class="field"><span class="field-label">Title</span><input id="am_title" class="input" placeholder="e.g. Chapter 4 — Algebra"/></div>
      <div class="field"><span class="field-label">Link (Drive, YouTube, etc.)</span><input id="am_url" class="input" placeholder="https://…"/></div>
      <div class="field"><span class="field-label">Note (optional)</span><input id="am_note" class="input" placeholder="Anything students should know"/></div>
      <button class="btn btn-yellow" onclick="addMaterial('${classId}', selectedMaterialType)">Upload material</button>
    </div>
  </div>`;
}
function screenStudentHome(){
  const list = myStudentClasses();
  return `<div class="scroll">
    ${topbar('My Classes',{logout:true})}
    <p class="px6" style="font-size:14px;color:var(--dim);margin-bottom:16px;">Signed in as <span style="color:var(--chalk)">${esc(state.name)}</span></p>
    <div class="px5" style="flex:1;">
      ${list.length===0 ? emptyState('No classes joined','Ask your tutor for a class code to get started.') : list.map(c=>classCard(c,'student')).join('')}
    </div>
    <div class="px5" style="padding-top:20px;padding-bottom:20px;">
      <button class="btn btn-blue" onclick="state.screen='studentJoin';render()">&#128273; Join a class</button>
    </div>
  </div>`;
}
function screenStudentJoin(){
  return `<div class="scroll px6" style="padding-top:16px;">
    ${topbar('Join a class',{onBack:"state.screen='studentHome';render()"})}
    ${toast()}
    <p style="font-size:14px;color:var(--dim);margin-bottom:20px;">Enter the code your tutor shared with you.</p>
    <div class="field"><input id="jf_code" class="input" style="text-align:center;font-family:var(--font-mono);letter-spacing:.2em;font-weight:700;" maxlength="6" placeholder="ABC123" onkeydown="if(event.key==='Enter')joinClass();this.value=this.value.toUpperCase()"/></div>
    <button class="btn btn-blue" onclick="joinClass()">Join class</button>
  </div>`;
}
function screenStudentClass(){
  const c = activeClass(); if(!c) return screenStudentHome();
  const accent = hashAccent(c.subject);
  const materials = c.materials.map(m=>`
    <div class="mat-row">
      <div class="mat-icon blue">${TYPE_ICONS[m.type]||'&#128196;'}</div>
      <div style="flex:1;min-width:0;">
        <div class="card-title" style="font-size:14px;">${esc(m.title)}</div>
        <div class="card-desc" style="font-size:11px;">${esc(m.type)}${m.note?(' &middot; '+esc(m.note)):''}</div>
      </div>
      <a class="download-btn" href="${esc(m.url)}" target="_blank" rel="noopener">&#8681;</a>
    </div>`).join('');
  return `<div class="scroll">
    ${topbar(c.name,{onBack:"state.screen='studentHome';render()"})}
    <div class="px6">
      <p style="font-size:12px;font-weight:600;color:${accent};margin-bottom:4px;">${esc(c.subject)} &middot; Tutor: ${esc(c.tutorName)}</p>
      ${c.description?`<p style="font-size:13px;color:var(--dim);margin-bottom:20px;">${esc(c.description)}</p>`:''}
    </div>
    <div class="tear"></div>
    <div class="px5" style="flex:1;padding-top:16px;background:var(--panel);">
      <p style="font-size:14px;font-weight:600;color:var(--chalk);margin-bottom:12px;">Materials (${c.materials.length})</p>
      ${c.materials.length===0 ? emptyState('Nothing posted yet','Check back after class.') : materials}
      <div style="height:16px;"></div>
      <button class="danger-link" style="margin-bottom:24px;" onclick="leaveClass('${c.id}')">Leave this class</button>
    </div>
  </div>`;
}

/* ---------------- main render ---------------- */
function render(){
  let body='';
  switch(state.screen){
    case 'welcome': body=screenWelcome(); break;
    case 'name': body=screenName(); break;
    case 'tutorHome': body=screenTutorHome(); break;
    case 'tutorCreate': body=screenTutorCreate(); break;
    case 'tutorClass': body=screenTutorClass(); break;
    case 'studentHome': body=screenStudentHome(); break;
    case 'studentJoin': body=screenStudentJoin(); break;
    case 'studentClass': body=screenStudentClass(); break;
    default: body=screenWelcome();
  }
  document.getElementById('root').innerHTML = `<div class="phone"><div class="notch"><span></span></div>${body}</div>`;
  const nameField=document.getElementById('nameInput');
  if(nameField) nameField.focus();
}
render();
authReady.catch(e=>{ console.error('Firebase authentication failed',e); state.message='Firebase authentication failed: '+(e.message||e.code||'unknown error'); render(); });
</script>
</body>
</html>
