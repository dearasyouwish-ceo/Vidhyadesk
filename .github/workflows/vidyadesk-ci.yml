name: VidyaDesk CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          for f in www/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Check required release files
        shell: bash
        run: |
          set -e
          test -f supabase_schema.sql
          test -f supabase_fresh_reset.sql
          test -f supabase_verification.sql
          test -f PRODUCTION_RELEASE.md
          test -f www/index.html
          test -f www/app.js
          test -f www/release-gate.js
          test -f www/smoke-test.js
      - name: Guard client assets
        shell: bash
        run: |
          set -e
          if grep -RniE 'service_role|SUPABASE_SERVICE_ROLE_KEY' www --include='*.js' --include='*.html'; then
            echo 'Service-role secret detected in client assets'
            exit 1
          fi
