ackground:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr)}.bot button{border:0;background:#fff;color:#777;font-size:10px}.bot .on{color:#a40000;font-weight:bold}.login{min-height:100vh;background:#a40000;max-width:460px;margin:auto}.lh{height:245px;color:#fff;text-align:center;padding-top:38px}.logo{width:68px;height:68px;background:#fff;color:#a40000;margin:auto;border-radius:14px;display:grid;place-items:center;font-size:28px;font-weight:900}.lh h1{margin:9px 0 2px;font-size:21px}.lc{background:#fff;border-radius:22px 22px 0 0;min-height:calc(100vh - 245px);padding:14px}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.roles button{border:0;background:#fff;padding:9px;color:#777;border-radius:5px}.roles .on{background:#f3e5e5;color:#a40000;font-weight:bold}.err{background:#ffe5e5;color:#a40000;padding:8px;margin:10px 0}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end}.modal.on{display:flex}.sheet{background:#fff;width:min(460px,100%);margin:auto;border-radius:14px 14px 0 0;padding:12px;max-height:90vh;overflow:auto}.toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:20px;z-index:9;font-size:12px}</style></head><body><div id="app"></div><div id="modal" class="modal"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.55.0"></script><script>
const D=supabase.createClient('https://sanmenwzjcjbudjtdzvr.supabase.co','sb_publishable_KKNQ_eK7s7nfvxDXSqRXLg_v88xBC6c');let S={role:'student',page:'login',session:null,profile:null,students:[],batches:[],fees:[],employees:[],leads:[],courses:[]};const $=i=>document.getElementById(i),e=x=>String(x??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[m]));function t(x){let z=document.createElement('div');z.className='toast';z.textContent=x;document.body.append(z);setTimeout(()=>z.remove(),1800)}
function login(){document.body.innerHTML=`<div class="login"><div class="lh"><div class="logo">V</div><h1>VidyaDesk</h1><small>Smart Institute Management</small></div><div class="lc"><div class="roles">${[['admin','Admin'],['teacher','Teacher'],['student','Student'],['parent','Parent'],['employee','Staff'],['owner','Owner']].map(x=>`<button class="${S.role===x[0]?'on':''}" onclick="S.role='${x[0]}';login()">${x[1]}</button>`).join('')}</div><div id="err"></div><div class="form" style="margin-top:12px"><input id="em" class="in" placeholder="Email / Login ID"><input id="pw" class="in" type="password" placeholder="Password"><button class="btn full" onclick="signin()">Login as ${S.role[0].toUpperCase()+S.role.slice(1)}</button><button class="btn light full" onclick="preview()">Preview VidyaDesk UI</button></div><div class="muted" style="text-align:center;margin-top:10px">No automatic login. Uses Supabase Auth.</div></div></div>`}
async function signin(){let r=await D.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(r.error){$('err').innerHTML='<div class="err">'+e(r.error.message)+'</div>';return}S.session=r.data.session;let p=await D.from('profiles').select('*').eq('id',r.data.user.id).maybeSingle();if(p.error){$('err').innerHTML='<div class="err">'+e(p.error.message)+'</div>';return}if(!p.data){$('err').innerHTML='<div class="err">Profile not found. Complete institute setup first.</div>';return}S.profile=p.data;S.role=p.data.role==='admin'?'admin':p.data.role;S.page='dashboard';await load();render()}
async function load(){if(!S.profile?.institute_id)return;for(const[k,tb]of Object.entries({students:'students',batches:'batches',fees:'fee_bills',employees:'employees',leads:'leads',courses:'courses'})){try{let r=await D.from(tb).select('*').eq('institute_id',S.profile.institute_id).limit(500);S[k]=r.data||[]}catch(_){}}}
async function out(){await D.auth.signOut();S={role:'student',page:'login',session:null,profile:null,students:[],batches:[],fees:[],employees:[],leads:[],courses:[]};login()}function go(p){S.page=p;render()}function render(){if(!S.session||!S.profile)return login();let fn={dashboard,students,batches,fees,attendance,employees,learning,exams,leads,reports,access,settings,profile,homework,notices,leave}[S.page]||dashboard;document.body.innerHTML=`<div class="p"><div class="top"><button onclick="nav()">☰</button><b>VidyaDesk</b><span class="sp"></span><button onclick="load().then(render)">↻</button><button onclick="out()">↪</button></div><div class="b">${fn()}</div><div class="bot"><button class="${S.page==='dashboard'?'on':''}" onclick="go('dashboard')">⌂<br>Home</button><button class="${S.page==='students'?'on':''}" onclick="go('students')">♙<br>Students</button><button class="${S.page==='fees'?'on':''}" onclick="go('fees')">₹<br>Fees</button><button class="${S.page==='settings'?'on':''}" onclick="go('settings')">⚙<br>Settings</button></div></div>`}
function nav(){let a=S.role==='teacher'?[['dashboard','Dashboard'],['students','Students'],['attendance','Attendance'],['homework','Homework'],['learning','Courses'],['exams','Marks / Results'],['leads','Enquiries'],['leave','Leave']]:S.role==='student'||S.role==='parent'?[['dashboard','Dashboard'],['profile','My Profile'],['fees','Fees'],['attendance','Attendance'],['homework','Homework'],['learning','Online Courses'],['exams','Online Exam'],['notices','Notices']]:[['dashboard','Dashboard'],['students','Active Students'],['batches','Batches'],['fees','Fee Collection'],['attendance','Student Attendance'],['employees','Employees / Payroll'],['learning','Online Courses'],['exams','Exams / Results'],['leads','Enquiries / Leads'],['reports','Reports'],['access','Online Access'],['settings','Institute Settings']];let m=document.createElement('div');m.className='modal on';m.innerHTML='<div class="sheet"><b>VidyaDesk</b><div class="list" style="margin-top:10px">'+a.map(x=>`<button class="btn light full" onclick="this.closest('.modal').remove();go('${x[0]}')">${x[1]}</button>`).join('')+'</div></div>';document.body.append(m)}
function dashboard(){if(S.role==='student'||S.role==='parent')return studentDash();if(S.role==='teacher')return teacherDash();let active=S.students.filter(x=>x.status!=='inactive').length,col=S.fees.reduce((n,x)=>n+Number(x.net_amount||x.amount||0),0);return `<div class="hero"><div class="promo"><b>Online Courses</b><br>Video + PDF learning for your batches</div><div class="notice"><b>Free plan — Pro features locked</b><br>Fee reminders, cloud backup and advanced automation.</div></div><div class="sec">Business Snapshot</div><div class="snap"><div class="snaprow"><div class="snapbox">₹${col}<br><small>Collection</small></div><div class="snapbox">₹${S.fees.filter(x=>x.status!=='paid').reduce((n,x)=>n+Number(x.net_amount||0),0)}<br><small>Pending fee</small></div></div></div><div class="online"><b>●</b><div class="grow"><b>Go Online</b><div class="muted">Teacher / Student / Parent Login</div></div><button class="btn" onclick="go('access')">Open</button></div><div class="sec">Overview</div><div class="gr"><div class="card">🔵 ${active}<br><span class="muted">Active Students</span></div><div class="card">🔴 ${S.students.filter(x=>x.status==='inactive').length}<br><span class="muted">Inactive Students</span></div><div class="card">🟢 ${S.employees.length}<br><span class="muted">Employees</span></div><div class="card">🔴 ₹0<br><span class="muted">Expenses</span></div></div><div class="sec">Quick Actions</div><div class="gr">${[['students','♙','Add Student'],['fees','₹','Collect Fees'],['fees','!','Fee Reminder'],['attendance','✓','Student Attendance'],['employees','●','Employee Management'],['attendance','✓','Employee Attendance'],['reports','▤','Student Reports'],['fees','₹','Fee Due']].map(x=>`<button class="q" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('')}</div><div class="sec">Manage</div><div class="gr"><button class="q" onclick="go('leads')"><i>☏</i>Leads / Enquiry</button><button class="q" onclick="go('reports')"><i>▤</i>Defaulter Report</button><button class="q" onclick="go('settings')"><i>⚙</i>Settings</button><button class="q" onclick="go('reports')"><i>⌕</i>Search</button></div>`}
function teacherDash(){return `<div class="hero"><div class="snap"><b>Dashboard</b><br><small>Namaste, ${e(S.profile.full_name||'Teacher')}</small></div></div><div class="gr">${[['profile','♙','My Profile'],['notices','▣','Notices'],['students','♙','Students'],['attendance','✓','Attendance'],['exams','★','Marks / Results'],['homework','▤','Homework'],['learning','▣','Study Material'],['learning','▶','Online Courses'],['exams','★','Online Exam'],['leads','☏','Enquiries'],['leave','↗','Leave / Request']].map(x=>`<button class="q" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('')}</div>`}function studentDash(){return `<div class="hero"><div class="snap"><b>Dashboard</b><br><small>Namaste, ${e(S.profile.full_name||'student')}</small></div></div><div class="gr">${[['profile','♙','My Profile'],['notices','▣','Notices'],['fees','₹','Fees'],['attendance','✓','Attendance'],['exams','★','Marks / Results'],['homework','▤','Homework'],['learning','▣','Study Material'],['learning','▶','Online Courses'],['exams','★','Online Exam'],['fees','₹','Fee Due']].map(x=>`<button class="q" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('')}</div>`}
function students(){return `<div class="card"><b style="display:block;background:#a40000;color:#fff;padding:10px;margin:-10px -10px 10px">Active Students</b><input id="search" class="in" placeholder="Search students" oninput="search(this.value)"></div><div id="sl" class="list">${cards(S.students)}</div><button class="btn" style="position:fixed;right:20px;bottom:70px;border-radius:50%;width:45px;height:45px" onclick="addStudent()">+</button>`}function cards(a){return a.length?a.map(s=>`<div class="student"><div class="row"><div class="avatar">${e((s.full_name||s.name||'S')[0])}</div><div class="grow"><b>${e(s.full_name||s.name)}</b><div class="muted">${e(s.mobile||s.phone||'')} • ${e(s.batch_name||'Morning')}</div></div><span class="badge">${e(s.status||'Active')}</span></div><button class="btn light full" style="margin-top:7px" onclick="smenu('${s.id}')">View Full Details</button></div>`).join(''):'<div class="card muted">No students found.</div>'}function search(v){$('sl').innerHTML=cards(S.students.filter(s=>JSON.stringify(s).toLowerCase().includes(v.toLowerCase())))}
function smenu(id){let s=S.students.find(x=>x.id===id);modal(`<b>${e(s.full_name||s.name)}</b><button class="btn light full" onclick="closeM();go('fees')">Manage Fees</button><button class="btn light full" onclick="idcard()">ID Card</button><button class="btn light full" onclick="closeM()">Edit Student</button>`)}function addStudent(){modal(`<b>Add Student</b><div class="form"><input id="sn" class="in" placeholder="Student Name *"><input id="sg" class="in" placeholder="Guardian Name *"><input id="sm" class="in" placeholder="Mobile Number *"><input id="sa" class="in" placeholder="Address"><input id="sd" class="in" type="date"><select id="sb" class="in"><option>Select Batch</option>${S.batches.map(b=>`<option>${e(b.name||b.batch_name)}</option>`).join('')}</select><button class="btn full" onclick="saveStudent()">Save Student</button></div>`)}async function saveStudent(){let r=await D.from('students').insert({institute_id:S.profile.institute_id,full_name:$('sn').value.trim(),guardian_name:$('sg').value.trim(),mobile:$('sm').value.trim(),address:$('sa').value.trim(),date_of_birth:$('sd').value||null,status:'active'});if(r.error)t(r.error.message);else{t('Student added');closeM();await load();render()}}
function batches(){return `<div class="card"><b style="display:block;background:#a40000;color:#fff;padding:10px;margin:-10px -10px 10px">Batches</b><button class="btn full" onclick="addBatch()">+ Add Batch</button></div>${S.batches.map(b=>`<div class="card"><b>${e(b.name||b.batch_name)}</b><div class="muted">${e(b.location||'')} • ${e(b.start_time||'')}</div></div>`).join('')||'<div class="card muted">No batches.</div>'}`}function addBatch(){modal(`<b>Add Batch</b><div class="form"><input id="bn" class="in" placeholder="Batch Name"><input id="bl" class="in" placeholder="Location"><input id="bt" class="in" placeholder="Batch Teacher"><button class="btn full" onclick="saveBatch()">Save Batch</button></div>`)}async function saveBatch(){let r=await D.from('batches').insert({institute_id:S.profile.institute_id,name:$('bn').value.trim(),location:$('bl').value.trim(),start_time:$('bt').value.trim()});if(r.error)t(r.error.message);else{t('Batch created');closeM();await load();render()}}
function fees(){return `<div class="card"><b style="display:block;background:#a40000;color:#fff;padding:10px;margin:-10px -10px 10px">Collect Fee</b><h2>₹${S.fees.reduce((n,x)=>n+Number(x.net_amount||x.amount||0),0)}</h2><button class="btn full" onclick="collect()">Collect Payment</button></div>${S.fees.map(f=>`<div class="fee"><div class="row"><div class="grow"><b>${e(f.bill_number||f.period||'Fee')}</b><div class="muted">${e(f.status||'Pending')}</div></div><b>₹${Number(f.net_amount||f.amount||0)}</b></div><button class="btn light full" style="margin-top:7px" onclick="collect()">Pay</button></div>`).join('')||'<div class="card muted">No fee records.</div>'}`}function collect(){modal(`<b>Collect Fee</b><div class="form"><select id="fs" class="in">${S.students.map(s=>`<option>${e(s.full_name||s.name)}</option>`).join('')}</select><input id="fa" class="in" placeholder="Amount"><select id="fm" class="in"><option>Cash</option><option>UPI</option><option>Online</option><option>Bank</option><option>Cheque</option></select><button class="btn full" onclick="pay()">Collect Payment</button></div>`)}async function pay(){let s=S.students.find(x=>(x.full_name||x.name)===$('fs').value),r=await D.from('fee_payments').insert({institute_id:S.profile.institute_id,student_id:s?.id,amount:Number($('fa').value||0),payment_mode:$('fm').value.toLowerCase()});if(r.error)t(r.error.message);else{t('Payment saved');closeM();await load();render()}}
function attendance(){return `<div class="card"><b style="display:block;background:#a40000;color:#fff;padding:10px;margin:-10px -10px 10px">Attendance</b><div class="muted">Mark Attendance — ${new Date().toLocaleDateString('en-IN')}</div><div class="gr"><button class="btn light" onclick="t('All Present')">All Present</button><button class="btn light" onclick="t('All Absent')">All Absent</button></div></div>${S.students.map(s=>`<div class="card row"><div class="grow"><b>${e(s.full_name||s.name)}</b></div><button class="btn light" onclick="this.textContent='P'">P</button><button class="btn light" onclick="this.textContent='A'">A</button></div>`).join('')}<button class="btn full" onclick="t('Attendance saved')">Save Attendance</button>`}
function employees(){return `<div class="card"><b style="display:block;background:#a40000;color:#fff;padding:10px;margin:-10px -10px 10px">Employees</b><button class="btn full" onclick="addEmp()">+ Add Employee</button></div>${S.employees.map(x=>`<div class="card"><b>${e(x.full_name||x.name)}</b><div class="muted">${e(x.role||'Employee')} • ${e(x.mobile||'')}</div></div>`).join('')||'<div class="card muted">No employees.</div>'}`}function addEmp(){modal(`<b>Add Employee</b><div class="form"><input id="en" class="in" placeholder="Employee Name"><select id="er" class="in"><option>Teacher</option><option>Principal</option><option>Coordinator</option><option>Accountant</option><option>Clerk / Office Admin</option><option>Other</option></select><input id="em" class="in" placeholder="Mobile"><input id="es" class="in" placeholder="Salary"><button class="btn full" onclick="saveEmp()">Save Employee</button></div>`)}async function saveEmp(){let r=await D.from('employees').insert({institute_id:S.profile.institute_id,full_name:$('en').value.trim(),role:$('er').value,mobile:$('em').value.trim(),salary:Number($('es').value||0)});if(r.error)t(r.error.message);else{t('Employee saved');closeM();await load();render()}}
function learning(){return `<div class="card"><b style="display:block;background:#a40000;color:#fff;padding:10px;margin:-10px -10px 10px">Courses</b><button class="btn full" onclick="addCourse()">+ New Course</button></div>${S.courses.map(c=>`<div class="card"><b>${e(c.title||c.name)}</b><div class="muted">${e(c.description||'Video + PDF lessons')}</div><button class="btn light full" style="margin-top:7px" onclick="course('${c.id}')">Open Course</button></div>`).join('')||'<div class="card muted">No courses yet.</div>'}`}function addCourse(){modal(`<b>New Course</b><div class="form"><input id="ct" class="in" placeholder="Course title"><textarea id="cd" class="in" placeholder="Description"></textarea><button class="btn full" onclick="saveCourse()">Create Course</button></div>`)}async function saveCourse(){let r=await D.from('courses').insert({institute_id:S.profile.institute_id,title:$('ct').value.trim(),description:$('cd').value.trim(),status:'draft'});if(r.error)t(r.error.message);else{t('Course created');closeM();await load();render()}}function course(id){let c=S.courses.find(x=>x.id===id);modal(`<b>${e(c?.title||'Course')}</b><div class="card">Section 1 — Basics<br><br><button class="btn light full" onclick="t('Video lesson opened')">Lesson 1 • Introduction</button><button class="btn light full" style="margin-top:6px" onclick="t('PDF lesson opened')">Lesson 2 • Notes (PDF)</button></div>`)}function exams(){return `<div class="card"><b style="display:block;background:#a40000;color:#fff;padding:10px;margin:-10px -10px 10px">Demo Quiz — General Knowledge</b><b>Q1. 2 + 2 = ?</b><br><label><input type="radio" name="q"> 3</label><br><label><input type="radio" name="q"> 4</label><br><label><input type="radio" name="q"> 5</label><button class="btn full" style="margin-top:10px" onclick="t('Exam submitted')">Submit Exam</button></div>`}function leads(){return `<div class="card"><b style="display:block;background:#a40000;color:#fff;padding:10px;margin:-10px -10px 10px">Enquiries / Leads</b><button class="btn full" onclick="addLead()">+ Add Enquiry</button></div>${S.leads.map(x=>`<div class="card"><b>${e(x.name||x.full_name)}</b><div class="muted">${e(x.mobile||'')} • ${e(x.status||'new')}</div><div class="gr"><button class="btn light" onclick="t('Call')">Call</button><button class="btn light" onclick="t('WhatsApp')">WhatsApp</button></div></div>`).join('')||'<div class="card muted">No enquiries.</div>'}`}function addLead(){modal(`<b>Add Enquiry</b><div class="form"><input id="ln" class="in" placeholder="Name"><input id="lm" class="in" placeholder="Mobile"><textarea id="lo" class="in" placeholder="Notes"></textarea><button class="btn full" onclick="saveLead()">Save Enquiry</button></div>`)}async function saveLead(){let r=await D.from('leads').insert({institute_id:S.profile.institute_id,name:$('ln').value.trim(),mobile:$('lm').value.trim(),status:'new',notes:$('lo').value});if(r.error)t(r.error.message);else{t('Enquiry saved');closeM();await load();render()}}
function reports(){return `<div class="card"><b style="display:block;background:#a40000;color:#fff;padding:10px;margin:-10px -10px 10px">Reports</b><div class="gr">${['Student Report','Attendance Report','Fee Report','Fee Due','Paid Fee','Defaulter Report','Employee Report','Exam Report','Performance Report'].map(x=>`<button class="q" onclick="t('${x} opened')"><i>▤</i>${x}</button>`).join('')}</div></div>`}function access(){return `<div class="card"><b style="display:block;background:#a40000;color:#fff;padding:10px;margin:-10px -10px 10px">Online Access</b><button class="btn full" onclick="t('Notice published')">Post Notice</button></div>${S.employees.map(x=>`<div class="card row"><div class="grow"><b>${e(x.full_name||x.name)}</b><div class="muted">${e(x.role||'Teacher')}</div></div><button class="btn light" onclick="t('Reset Password')">Reset</button></div>`).join('')||'<div class="card muted">No online users yet.</div>'}`}function settings(){return `<div class="card"><b style="display:block;background:#a40000;color:#fff;padding:10px;margin:-10px -10px 10px">Institute Settings</b><button class="btn light full">Edit Institute Profile & Logo</button><button class="btn light full" style="margin-top:6px" onclick="go('access')">Go Online — Teacher / Student / Parent Login</button><button class="btn light full" style="margin-top:6px" onclick="t('ID Card & Certificate Designs')">ID Card & Certificate Designs</button><div class="sec">Fee Collection</div><label><input type="radio" checked> In Advance</label><br><label><input type="radio"> In Arrears</label><br><label><input type="radio"> Salary style</label></div>`}function profile(){return `<div class="card"><b style="display:block;background:#a40000;color:#fff;padding:10px;margin:-10px -10px 10px">My Profile</b><div style="text-align:center"><div class="avatar" style="margin:auto;width:70px;height:70px">${e((S.profile.full_name||'U')[0])}</div><h3>${e(S.profile.full_name||'User')}</h3><div class="muted">${e(S.profile.email||'')} • ${e(S.role)}</div></div></div>`}function homework(){return `<div class="card"><b style="display:block;background:#a40000;color:#fff;padding:10px;margin:-10px -10px 10px">Homework / Diary</b><button class="btn full" onclick="t('Homework composer opened')">+ Add Homework</button></div>`}function notices(){return `<div class="card"><b style="display:block;background:#a40000;color:#fff;padding:10px;margin:-10px -10px 10px">Notices</b><div>Welcome to VidyaDesk.</div></div>`}function leave(){return `<div class="card"><b style="display:block;background:#a40000;color:#fff;padding:10px;margin:-10px -10px 10px">Leave / Request</b><div class="form"><input class="in" type="date"><textarea class="in" placeholder="Reason"></textarea><button class="btn full" onclick="t('Leave request submitted')">Submit Request</button></div></div>`}
function modal(h){$('modal').innerHTML='<div class="sheet">'+h+'<button class="btn light full" style="margin-top:8px" onclick="closeM()">Close</button></div>';$('modal').className='modal on'}function closeM(){$('modal').className='modal'}function idcard(){closeM();modal('<div style="text-align:center"><b>VidyaDesk</b><h3>Student ID Card</h3><div style="width:90px;height:90px;margin:auto;background:repeating-linear-gradient(45deg,#111 0 4px,#fff 4px 8px)"></div><p>QR Enabled</p><button class="btn" onclick="print()">Print</button></div>')}function preview(){S.session={demo:true};S.profile={full_name:'Demo Admin',role:'admin',institute_id:'demo',email:'demo@vidyadesk.app'};S.role='admin';S.students=[{id:'1',full_name:'student1',mobile:'9759686111',status:'active'}];S.batches=[{id:'1',name:'Morning'}];S.employees=[{id:'1',full_name:'Teacher Demo',role:'Teacher'}];S.fees=[{id:'1',net_amount:500,status:'pending',bill_number:'02 Aug 2026'}];S.leads=[{name:'Demo Lead',mobile:'9999999999',status:'new'}];S.courses=[{id:'1',title:'Tuition Manager Tutorials',description:'Video + PDF lessons'}];S.page='dashboard';render()}
async function boot(){try{for(const r of await navigator.serviceWorker?.getRegistrations?.()||[])await r.unregister();for(const k of await caches?.keys?.()||[])await caches.delete(k)}catch(_){}let r=await D.auth.getSession();if(r.data.session){S.session=r.data.session;let p=await D.from('profiles').select('*').eq('id',r.data.session.user.id).maybeSingle();if(p.data){S.profile=p.data;S.role=p.data.role==='admin'?'admin':p.data.role;S.page='dashboard';await load();render();return}}login()}boot();</script></body></html>
