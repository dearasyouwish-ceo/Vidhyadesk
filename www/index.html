<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>VidyaDesk</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--navy:#12355b;--blue:#216bba;--pale:#eef6ff;--ink:#172033;--muted:#67748a;--line:#dce5f0;--green:#18804b;--orange:#a55a00;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:var(--ink);font:16px system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:620px;min-height:100vh;margin:auto;background:#fff}.top{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:23px 20px 19px}.top h1{font-size:25px;margin:0}.top p{margin:5px 0 0;opacity:.85;font-size:14px}.page{padding:20px 16px 94px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 13px;box-shadow:0 2px 7px #17355b0d}.hero{background:var(--pale);border-color:#cce0fa}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.module{min-height:120px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;color:var(--ink);font:inherit;font-weight:700}.module span{display:block;font-size:27px;margin-bottom:8px}.module small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:4px}h2{font-size:21px;margin:0 0 8px}h3{font-size:17px;margin:0 0 7px}p{line-height:1.45}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input,textarea,select{width:100%;padding:13px;border:1px solid #bcc9d8;border-radius:10px;background:#fff;font:inherit}textarea{min-height:100px;resize:vertical}button{border:0;border-radius:10px;padding:13px 15px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.secondary{background:#e8f1fb;color:#174b81}.danger{background:#fff0ef;color:var(--red)}.success{background:#e8f7ef;color:var(--green)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1;min-width:120px}.notice{padding:12px 13px;border-radius:10px;margin:12px 0;background:#fff5dd;color:#764b00;font-size:14px}.error{background:#fff0ef;color:var(--red)}.muted{color:var(--muted);font-size:14px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.list-item{padding:14px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border:0}.pill{display:inline-block;border-radius:99px;padding:4px 9px;font-size:12px;font-weight:700;background:#edf3fb;color:#265b91}.pill.pending{background:#fff2d9;color:var(--orange)}.pill.rejected{background:#fff0ef;color:var(--red)}.bottom{position:fixed;bottom:0;left:0;right:0;margin:auto;max-width:620px;background:#fff;border-top:1px solid var(--line);padding:11px 16px;display:flex;gap:10px}.bottom button{flex:1;padding:10px}.hidden{display:none!important}.code{font:bold 26px ui-monospace,monospace;letter-spacing:4px;color:var(--navy)}.count{font-size:30px;font-weight:800;color:var(--blue)}
  </style>
</head>
<body><main class="app"><header class="top"><h1>VidyaDesk</h1><p id="subtitle">Simple digital classroom</p></header><section class="page" id="app"></section><nav class="bottom hidden" id="bottom"></nav></main>
<script>
/* REPLACE these two values with the same values from your current working index.html. Never put a service_role key here. */
const SUPABASE_URL = 'https://sanmenwzjcjbudjtdzvr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_KKNQ_eK7s7nfvxDXSqRXLg_v88xBC6c';
const db = (SUPABASE_URL.startsWith('http') && !SUPABASE_ANON_KEY.startsWith('PASTE')) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const $ = s => document.querySelector(s); const app=$('#app'); let me=null, profile=null, activeClass=null;
const esc = s => String(s ?? '').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function message(text, bad=false){ return `<div class="notice ${bad?'error':''}">${esc(text)}</div>` }
function setBottom(items=[]){ const b=$('#bottom'); b.innerHTML=items.map(x=>`<button class="secondary" onclick="${x[1]}">${x[0]}</button>`).join(''); b.classList.toggle('hidden',!items.length) }
function busy(btn,on=true){if(btn){btn.disabled=on;btn.dataset.label??=btn.textContent;btn.textContent=on?'Please wait…':btn.dataset.label}}
async function requireDb(){if(!db)throw Error('Add your Supabase URL and anon/publishable key at the top of index.html first.');}
async function boot(){ try{await requireDb(); const {data:{session}}=await db.auth.getSession(); if(!session) return login(); me=session.user; await loadProfile(); profile?home():onboard(); }catch(e){ login(e.message) } }
function login(err=''){setBottom([]);app.innerHTML=`<div class="card hero"><h2>Welcome to VidyaDesk</h2><p>Login with your email. New users will verify with an OTP code sent by email.</p></div>${err?message(err,true):''}<div class="card"><h3>Choose your role</h3><div class="grid"><button class="module" onclick="emailLogin('tutor')"><span>👨‍🏫</span>I am a Tutor<small>Create and manage classes</small></button><button class="module" onclick="emailLogin('student')"><span>👨‍🎓</span>I am a Student<small>Join your tutor's class</small></button></div></div>`}
function emailLogin(role){ app.innerHTML=`<div class="card"><h2>${role==='tutor'?'Tutor':'Student'} login</h2><p class="muted">We will send a 6-digit OTP code to your email.</p><label>Email address</label><input id="email" type="email" inputmode="email" placeholder="you@example.com"><div class="actions"><button class="secondary" onclick="login()">Back</button><button onclick="sendOtp('${role}',this)">Send OTP</button></div></div>`; }
async function sendOtp(role,btn){try{busy(btn);await requireDb();const email=$('#email').value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw Error('Enter a valid email address.');const {error}=await db.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(error)throw error;otpScreen(role,email)}catch(e){alert(e.message)}finally{busy(btn,false)}}
function otpScreen(role,email){app.innerHTML=`<div class="card"><h2>Enter OTP</h2><p class="muted">OTP sent to ${esc(email)}</p><label>8-digit OTP</label><input id="otp" inputmode="numeric" maxlength="8" placeholder="12345678"><div class="actions"><button class="secondary" onclick="emailLogin('${role}')">Back</button><button onclick="verifyOtp('${role}','${email}',this)">Verify & continue</button></div></div>`}
async function verifyOtp(role,email,btn){try{busy(btn);const token=$('#otp').value.trim();if(!/^\d{8}$/.test(token))throw Error('Enter the 8-digit OTP from your email.');const {data,error}=await db.auth.verifyOtp({email,token,type:'email'});if(error)throw error;me=data.user;await loadProfile();if(!profile)onboard(role);else home()}catch(e){alert(e.message)}finally{busy(btn,false)}}
async function loadProfile(){const {data,error}=await db.from('profiles').select('*').eq('id',me.id).maybeSingle();if(error)throw error;profile=data}
function onboard(role=''){setBottom([]);app.innerHTML=`<div class="card"><h2>Complete your profile</h2><label>Your name</label><input id="name" placeholder="Enter your name"><label>I am a</label><select id="role"><option value="tutor" ${role==='tutor'?'selected':''}>Tutor</option><option value="student" ${role==='student'?'selected':''}>Student</option></select><div class="actions"><button onclick="saveProfile(this)">Continue</button></div></div>`}
async function saveProfile(btn){try{busy(btn);const full_name=$('#name').value.trim(), role=$('#role').value;if(full_name.length<2)throw Error('Please enter your name.');const {error}=await db.from('profiles').insert({id:me.id,full_name,role,phone:me.email});if(error)throw error;await loadProfile();home()}catch(e){alert(e.message)}finally{busy(btn,false)}}
function home(){ $('#subtitle').textContent=`${profile.full_name} · ${profile.role==='tutor'?'Tutor':'Student'}`; profile.role==='tutor'?tutorHome():studentHome(); }
async function tutorHome(){setBottom([['My Classes','tutorClasses()'],['Logout','logout()']]);const {data:classes,error}=await db.from('classes').select('*').order('created_at',{ascending:false});if(error)return fail(error);const {count}=await db.from('class_memberships').select('*',{count:'exact',head:true});const {count:pending}=await db.from('class_join_requests').select('*',{count:'exact',head:true}).eq('status','pending');app.innerHTML=`<div class="card hero"><div class="row"><div><h2>Hello, ${esc(profile.full_name)}</h2><p class="muted">Manage your classes simply.</p></div><button onclick="newClass()">+ New class</button></div></div><div class="grid"><button class="module" onclick="tutorClasses()"><span>📚</span>My Classes<small>${classes.length} class(es)</small></button><button class="module" onclick="students()"><span>👨‍🎓</span>My Students<small>${count||0} approved students</small></button><button class="module" onclick="requests()"><span>🔔</span>Join Requests<small>${pending||0} pending</small></button><button class="module" onclick="tutorClasses('material')"><span>📤</span>Send Material<small>PDF, photo, video or link</small></button><button class="module" onclick="tutorClasses('homework')"><span>📝</span>Homework<small>Give work to students</small></button><button class="module" onclick="tutorClasses('notice')"><span>📢</span>Notice<small>Send announcement</small></button></div>`}
async function tutorClasses(next=''){setBottom([['Home','tutorHome()'],['+ New class','newClass()']]);const {data,error}=await db.from('classes').select('*').order('created_at',{ascending:false});if(error)return fail(error);app.innerHTML=`<div class="row"><h2>My Classes</h2><button onclick="newClass()">+ New</button></div>${data.length?data.map(c=>`<div class="card"><div class="row"><div><h3>${esc(c.name)}</h3><p class="muted">${esc(c.subject||'')}</p><div class="code">${esc(c.class_code)}</div></div><button onclick="openTutorClass('${c.id}','${next}')">Open</button></div></div>`).join(''):`<div class="card"><p>No class yet. Create your first class.</p></div>`}`}
function newClass(){setBottom([['Back','tutorHome()']]);app.innerHTML=`<div class="card"><h2>Create class</h2><label>Class name</label><input id="className" placeholder="Example: Std 8 Maths"><label>Subject (optional)</label><input id="subject" placeholder="Example: Mathematics"><div class="actions"><button class="secondary" onclick="tutorHome()">Cancel</button><button onclick="createClass(this)">Create class</button></div></div>`}
async function createClass(btn){try{busy(btn);const name=$('#className').value.trim(),subject=$('#subject').value.trim();if(name.length<2)throw Error('Enter a class name.');const {error}=await db.from('classes').insert({name,subject});if(error)throw error;tutorClasses()}catch(e){alert(e.message)}finally{busy(btn,false)}}
async function openTutorClass(id,section=''){activeClass=id;const {data:c,error}=await db.from('classes').select('*').eq('id',id).single();if(error)return fail(error);setBottom([['Classes','tutorClasses()'],['Students','students()']]);app.innerHTML=`<div class="card hero"><h2>${esc(c.name)}</h2><p>${esc(c.subject||'')}</p><p>Student joining code</p><div class="code">${esc(c.class_code)}</div></div><div class="grid"><button class="module" onclick="requests('${id}')"><span>🔔</span>Join Requests</button><button class="module" onclick="students('${id}')"><span>👨‍🎓</span>Students</button><button class="module" onclick="compose('material','${id}')"><span>📤</span>Send Material</button><button class="module" onclick="compose('homework','${id}')"><span>📝</span>Homework</button><button class="module" onclick="compose('notice','${id}')"><span>📢</span>Notice</button></div>`;if(section)compose(section,id)}
async function requests(classId=''){setBottom([['Home','tutorHome()'],['Classes','tutorClasses()']]);let q=db.from('class_join_requests').select('*, classes(name)').eq('status','pending').order('created_at',{ascending:false});if(classId)q=q.eq('class_id',classId);const {data,error}=await q;if(error)return fail(error);app.innerHTML=`<h2>Pending join requests</h2>${data.length?data.map(r=>`<div class="card"><h3>${esc(r.student_name)}</h3><p class="muted">✉️ ${esc(r.student_phone||'Email not available')}<br>📚 ${esc(r.classes?.name||'')}</p><div class="actions"><button class="success" onclick="decide('${r.id}','approved',this)">Approve</button><button class="danger" onclick="decide('${r.id}','rejected',this)">Reject</button></div></div>`).join(''):`<div class="card"><p>No pending requests.</p></div>`}`}
async function decide(id,status,btn){try{busy(btn);const {error}=await db.rpc('review_join_request',{p_request_id:id,p_status:status});if(error)throw error;requests()}catch(e){alert(e.message)}finally{busy(btn,false)}}
async function students(classId=''){setBottom([['Home','tutorHome()'],['Classes','tutorClasses()']]);let q=db.from('class_memberships').select('*, classes(name)').order('approved_at',{ascending:false});if(classId)q=q.eq('class_id',classId);const {data,error}=await q;if(error)return fail(error);app.innerHTML=`<div class="card hero"><div class="count">${data.length}</div><h2>Approved Students</h2><p class="muted">Only students you approved are shown here.</p></div><input id="search" placeholder="Search name or email" oninput="filterStudents()"><div id="studentList">${data.map(s=>`<div class="card student"><h3>${esc(s.student_name)}</h3><p class="muted">✉️ ${esc(s.student_phone||'Email not available')}<br>📚 ${esc(s.classes?.name||'')}</p></div>`).join('')||'<div class="card"><p>No approved students yet.</p></div>'}</div>`}
function filterStudents(){const q=$('#search').value.toLowerCase();document.querySelectorAll('.student').forEach(x=>x.classList.toggle('hidden',!x.textContent.toLowerCase().includes(q)))}
async function compose(type,classId){activeClass=classId;setBottom([['Back','openTutorClass(activeClass)']]);const label={material:'Send Material',homework:'Give Homework',notice:'Send Notice'}[type];app.innerHTML=`<div class="card"><h2>${label}</h2><label>Title</label><input id="title" placeholder="Enter title"><label>${type==='notice'?'Announcement':type==='homework'?'Homework details':'Material details'}</label><textarea id="body" placeholder="Write here"></textarea>${type==='material'?'<label>Link to PDF, photo or video (optional)</label><input id="link" type="url" placeholder="https://">':''}<div class="actions"><button onclick="publish('${type}',this)">Send to approved students</button></div></div>`}
async function publish(type,btn){try{busy(btn);const title=$('#title').value.trim(),body=$('#body').value.trim();if(!title||!body)throw Error('Enter a title and details.');const table=type==='material'?'materials':type==='homework'?'homework':'notices';const row={class_id:activeClass,title,body};if(type==='material')row.link=$('#link').value.trim()||null;const {error}=await db.from(table).insert(row);if(error)throw error;alert('Sent successfully.');openTutorClass(activeClass)}catch(e){alert(e.message)}finally{busy(btn,false)}}
async function studentHome(){setBottom([['My Classes','studentClasses()'],['Logout','logout()']]);const {data,error}=await db.from('class_memberships').select('*, classes(*)').order('approved_at',{ascending:false});if(error)return fail(error);const {data:pending}=await db.from('class_join_requests').select('*, classes(name)').order('created_at',{ascending:false});app.innerHTML=`<div class="card hero"><h2>Hello, ${esc(profile.full_name)}</h2><p>Join a class using the code from your tutor. Your tutor must approve the request.</p><button onclick="joinClass()">+ Join a class</button></div><div class="grid"><button class="module" onclick="studentClasses()"><span>📚</span>My Class<small>${data.length} approved class(es)</small></button><button class="module" onclick="studentFeed('materials')"><span>📂</span>Material</button><button class="module" onclick="studentFeed('homework')"><span>📝</span>Homework</button><button class="module" onclick="studentFeed('notices')"><span>📢</span>Notice</button></div>${pending?.length?`<div class="card"><h3>Join request status</h3>${pending.map(r=>`<div class="list-item">${esc(r.classes?.name||'Class')} <span class="pill ${r.status}">${esc(r.status)}</span></div>`).join('')}</div>`:''}`}
function joinClass(){setBottom([['Home','studentHome()']]);app.innerHTML=`<div class="card"><h2>Join a class</h2><p class="muted">Enter the 6-character code your tutor gave you. Your request will be sent for approval.</p><label>Class code</label><input id="joinCode" maxlength="6" autocapitalize="characters" placeholder="AB12CD"><div class="actions"><button onclick="sendJoin(this)">Send join request</button></div></div>`}
async function sendJoin(btn){try{busy(btn);const code=$('#joinCode').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code))throw Error('Enter a valid 6-character class code.');const {error}=await db.rpc('request_join_by_code',{p_class_code:code});if(error)throw error;alert('Join request sent. Your tutor must approve it before you can access the class.');studentHome()}catch(e){alert(e.message)}finally{busy(btn,false)}}
async function studentClasses(){setBottom([['Home','studentHome()'],['+ Join','joinClass()']]);const {data,error}=await db.from('class_memberships').select('*, classes(*)').order('approved_at',{ascending:false});if(error)return fail(error);app.innerHTML=`<h2>My Classes</h2>${data.length?data.map(m=>`<div class="card"><h3>${esc(m.classes.name)}</h3><p class="muted">${esc(m.classes.subject||'')}</p><button onclick="studentClass('${m.class_id}')">Open class</button></div>`).join(''):`<div class="card"><p>No approved class yet.</p></div>`}`}
async function studentClass(id){activeClass=id;setBottom([['Classes','studentClasses()']]);const {data:c,error}=await db.from('classes').select('*').eq('id',id).single();if(error)return fail(error);app.innerHTML=`<div class="card hero"><h2>${esc(c.name)}</h2><p>${esc(c.subject||'')}</p></div><div class="grid"><button class="module" onclick="studentFeed('materials','${id}')"><span>📂</span>Material</button><button class="module" onclick="studentFeed('homework','${id}')"><span>📝</span>Homework</button><button class="module" onclick="studentFeed('notices','${id}')"><span>📢</span>Notice</button></div>`}
async function studentFeed(table,classId=''){setBottom([['Home','studentHome()'],['My Classes','studentClasses()']]);let q=db.from(table).select('*, classes(name)').order('created_at',{ascending:false});if(classId)q=q.eq('class_id',classId);const {data,error}=await q;if(error)return fail(error);const labels={materials:'Study Material',homework:'Homework',notices:'Notices'};app.innerHTML=`<h2>${labels[table]}</h2>${data.length?data.map(x=>`<div class="card"><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p><p class="muted">${esc(x.classes?.name||'')}</p>${x.link?`<a href="${esc(x.link)}" target="_blank" rel="noopener">Open attachment</a>`:''}</div>`).join(''):`<div class="card"><p>Nothing here yet.</p></div>`}`}
async function logout(){await db.auth.signOut();me=null;profile=null;login()}
function fail(e){app.innerHTML=message(e.message||String(e),true)} boot();
</script></body></html>
