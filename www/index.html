<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VidyaDesk — Tuition Manager</title>
<meta name="theme-color" content="#8f0d0d" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.55.0"></script>
<style>
:root{--red:#8f0d0d;--red2:#b91c1c;--pink:#fff1f2;--bg:#f7f7f8;--text:#2b2526;--muted:#706769;--card:#fff;--border:#e9d9dc;--green:#198754;--amber:#c67a00;--blue:#2563eb;--shadow:0 6px 18px rgba(40,15,20,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{min-height:100vh}.topbar{height:58px;background:var(--red);color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;position:sticky;top:0;z-index:30}.topbar .title{font-weight:800;font-size:18px;flex:1;letter-spacing:.1px}.iconbtn{width:36px;height:36px;border-radius:10px;background:transparent;color:#fff;font-size:20px}.layout{display:flex;min-height:calc(100vh - 58px)}.sidebar{width:245px;background:#fff;border-right:1px solid var(--border);padding:14px 10px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}.brand{padding:10px 12px 18px;border-bottom:1px solid #eee;margin-bottom:10px}.brand .logo{width:44px;height:44px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;float:left;margin-right:10px}.brand h2{font-size:17px;margin:2px 0}.brand-name{font-size:18px;font-weight:800;line-height:44px;color:var(--text);white-space:nowrap}.brand small{color:var(--muted)}.nav{display:grid;gap:5px}.nav button{background:transparent;text-align:left;padding:10px 12px;border-radius:10px;color:#4e4547;display:flex;align-items:center;gap:10px}.nav button.active,.nav button:hover{background:var(--pink);color:var(--red);font-weight:650}.main{flex:1;min-width:0;padding:16px}.page{max-width:1250px;margin:0 auto}.mobile-nav{display:none}.app-brand-text{font-weight:800;font-size:18px;color:inherit;white-space:nowrap}.grid{display:grid;gap:12px}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow)}.card h3{margin:0 0 8px;font-size:15px}.muted{color:var(--muted)}.metric{font-size:26px;font-weight:800;margin-top:6px}.section-title{display:flex;align-items:center;gap:10px;margin:8px 0 12px}.section-title h1{font-size:20px;margin:0}.spacer{flex:1}.btn{padding:9px 13px;border-radius:10px;background:var(--red);color:#fff;font-weight:650}.btn.secondary{background:#fff;color:var(--red);border:1px solid #d9b7bb}.btn.ghost{background:transparent;color:var(--red)}.btn.success{background:var(--green)}.btn.warning{background:#f59e0b}.btn.small{padding:7px 10px;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.input,.select,.textarea{width:100%;padding:10px 12px;border:1px solid #ddd0d3;border-radius:10px;background:#fff;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:var(--red2);box-shadow:0 0 0 3px rgba(185,28,28,.08)}.label{display:block;font-size:12px;color:#665b5d;margin:0 0 5px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .full{grid-column:1/-1}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px;background:#fff}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:10px 11px;border-bottom:1px solid #f0e5e7;text-align:left;font-size:13px}.table th{background:#fff7f8;color:#4f4245}.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.badge.active,.badge.paid{background:#e7f7ef;color:#0f6b3d}.badge.pending{background:#fff1d7;color:#986000}.badge.inactive{background:#eee;color:#666}.badge.info{background:#e8f0ff;color:#2450a6}.hero{background:linear-gradient(135deg,#b51226,#8f0d0d);color:#fff;border-radius:16px;padding:18px;box-shadow:var(--shadow)}.hero .big{font-size:24px;font-weight:800}.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.quick button{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;color:#4d4345}.quick .ico{font-size:21px;margin-bottom:4px}.empty{padding:28px;text-align:center;color:var(--muted)}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:50;display:none}.drawer.open{display:block}.drawer .panel{width:300px;max-width:84vw;height:100%;background:#fff;padding:16px;overflow:auto}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modal .box{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:16px}.toast{position:fixed;right:16px;bottom:16px;z-index:90;display:grid;gap:8px}.toast .t{background:#231f20;color:#fff;padding:10px 13px;border-radius:10px;box-shadow:var(--shadow);font-size:13px}.auth{min-height:100vh;background:linear-gradient(180deg,#8f0d0d 0 34%,#f6f6f7 34%);padding:28px 14px;display:grid;place-items:center}.auth-box{width:min(430px,100%);background:#fff;border-radius:18px;padding:20px;box-shadow:0 15px 40px rgba(30,0,0,.18)}.auth-brand{text-align:center;color:#fff;margin-bottom:22px}.auth-brand .circle{margin:auto;width:70px;height:70px;border-radius:20px;background:#fff;color:var(--red);display:grid;place-items:center;font-size:28px;font-weight:900}.role-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}.role-tabs button{padding:9px;border-radius:10px;background:#faf3f4;color:#6b5e60}.role-tabs button.active{background:var(--red);color:#fff}.hint{background:#fff8df;border:1px solid #efd78b;border-radius:12px;padding:9px;font-size:12px;color:#6e5d26;margin-bottom:12px}.login-actions{display:flex;gap:8px;align-items:center}.link{color:var(--red);text-decoration:none}.student-grid,.teacher-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff}.student-grid button,.teacher-grid button{padding:20px 10px;background:#fff;border-right:1px solid var(--border);border-bottom:1px solid var(--border);color:#5a4b4f}.student-grid button:nth-child(even),.teacher-grid button:nth-child(even){border-right:0}.student-grid .ico,.teacher-grid .ico{font-size:24px;color:var(--red);display:block;margin-bottom:5px}.list{display:grid;gap:8px}.list-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:12px}.avatar{width:40px;height:40px;border-radius:50%;background:#f8dddd;color:var(--red);display:grid;place-items:center;font-weight:800}.list-item .grow{flex:1}.course-card{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#fff}.course-head{padding:14px;background:#fff7f8}.course-body{padding:12px}.pillbar{display:flex;gap:6px;flex-wrap:wrap}.pillbar button{padding:7px 10px;border-radius:999px;background:#fff;border:1px solid var(--border);color:#64575a}.pillbar button.active{background:var(--pink);color:var(--red);border-color:#e9bcc3}.question{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}.option{display:flex;gap:8px;margin:7px 0}.footer-note{text-align:center;color:#8b7f81;font-size:11px;padding:20px}
@media(max-width:900px){.sidebar{display:none}.mobile-nav{display:block}.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:1fr 1fr}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.topbar{height:56px}.topbar .title{font-size:17px;display:block;overflow:visible}.main{padding:10px}.grid-2,.grid-3,.grid-4,.form-grid{grid-template-columns:1fr}.quick{grid-template-columns:1fr 1fr}.section-title h1{font-size:18px}.auth{padding:16px}.auth-box{padding:16px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal" class="modal"><div class="box" id="modalBox"></div></div>
<div id="drawer" class="drawer"><div class="panel" id="drawerPanel"></div></div>
<div id="toast" class="toast"></div>
<script>
const { createClient } = window.supabase;
const CONFIG = {
  url: localStorage.getItem('vd_supabase_url') || 'https://sanmenwzjcjbudjtdzvr.supabase.co',
  key: localStorage.getItem('vd_supabase_key') || 'sb_publishable_KKNQ_eK7s7nfvxDXSqRXLg_v88xBC6c'
};
let sb = null;
if(CONFIG.url.startsWith('http') && CONFIG.key.startsWith('sb_')) sb = createClient(CONFIG.url, CONFIG.key, {auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}});
else if(CONFIG.url.startsWith('http') && CONFIG.key.length>20) sb = createClient(CONFIG.url, CONFIG.key, {auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}});

const state = { session:null, profile:null, institute:null, role:'student', page:'dashboard', modal:null, data:{students:[],teachers:[],batches:[],fees:[],attendance:[],homework:[],notices:[],materials:[],courses:[],exams:[],leads:[]} };
const icons = {dashboard:'⌂',students:'👨‍🎓',teachers:'👩‍🏫',batches:'▦',fees:'₹',attendance:'✓',homework:'📝',notices:'🔔',materials:'📚',courses:'▶',exams:'☑',leads:'📞',reports:'▤',settings:'⚙',profile:'👤',timetable:'🗓'};
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function toast(msg){const n=document.createElement('div');n.className='t';n.textContent=msg;document.getElementById('toast').appendChild(n);setTimeout(()=>n.remove(),2800)}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function openDrawer(html){document.getElementById('drawerPanel').innerHTML=html;document.getElementById('drawer').classList.add('open')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open')}
function go(page){state.page=page; render()}
function isConfigured(){return !!sb}
async function q(table, opts={}){
  if(!sb) return {data:[],error:{message:'Supabase not configured'}};
  let query=sb.from(table).select(opts.select||'*');
  if(opts.eq) for(const [k,v] of Object.entries(opts.eq)) query=query.eq(k,v);
  if(opts.order) query=query.order(opts.order,{ascending:opts.asc!==false});
  if(opts.limit) query=query.limit(opts.limit);
  return await query;
}
async function insert(table,row){if(!sb) throw new Error('Supabase not configured');const {data,error}=await sb.from(table).insert(row).select().single();if(error)throw error;return data}
async function update(table,id,row){if(!sb) throw new Error('Supabase not configured');const {data,error}=await sb.from(table).update(row).eq('id',id).select().single();if(error)throw error;return data}
async function del(table,id){if(!sb) throw new Error('Supabase not configured');const {error}=await sb.from(table).delete().eq('id',id);if(error)throw error}

async function bootstrap(){
  if(!isConfigured()){renderAuth();return}
  const {data:{session}}=await sb.auth.getSession(); state.session=session;
  if(!session){renderAuth();return}
  const {data:profile,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(error){toast(error.message);renderAuth();return}
  state.profile=profile;
  if(profile?.institute_id){const {data:inst}=await sb.from('institutes').select('*').eq('id',profile.institute_id).maybeSingle();state.institute=inst}
  state.role=profile?.role||'student';
  await loadCore();
  render();
  sb.auth.onAuthStateChange((_e,s)=>{state.session=s;if(!s){state.profile=null;state.institute=null;renderAuth()}});
}
async function loadCore(){
  try{
    if(state.role==='admin'){
      const [s,t,b,f,l]=await Promise.all([q('students',{eq:{institute_id:state.profile.institute_id},order:'created_at',asc:false}),q('teachers',{eq:{institute_id:state.profile.institute_id},order:'created_at',asc:false}),q('batches',{eq:{institute_id:state.profile.institute_id},order:'name'}),q('fees',{eq:{institute_id:state.profile.institute_id},order:'fee_month',asc:false}),q('leads',{eq:{institute_id:state.profile.institute_id},order:'created_at',asc:false})]);
      state.data.students=s.data||[];state.data.teachers=t.data||[];state.data.batches=b.data||[];state.data.fees=f.data||[];state.data.leads=l.data||[];
    }else if(state.role==='teacher'){
      const [b,h,n,m,c,e]=await Promise.all([q('batches',{eq:{teacher_id:state.profile.id},order:'name'}),q('homework',{eq:{teacher_id:state.profile.id},order:'due_date',asc:false}),q('notices',{eq:{institute_id:state.profile.institute_id},order:'created_at',asc:false,limit:10}),q('study_materials',{eq:{teacher_id:state.profile.id},order:'created_at',asc:false}),q('courses',{eq:{teacher_id:state.profile.id},order:'created_at',asc:false}),q('exams',{eq:{teacher_id:state.profile.id},order:'created_at',asc:false})]);
      state.data.batches=b.data||[];state.data.homework=h.data||[];state.data.notices=n.data||[];state.data.materials=m.data||[];state.data.courses=c.data||[];state.data.exams=e.data||[];
    }else{
      const [n,h,m,c,e,t]=await Promise.all([q('notices',{eq:{institute_id:state.profile.institute_id},order:'created_at',asc:false,limit:10}),q('homework',{eq:{student_id:state.profile.id},order:'due_date',asc:false}),q('study_materials',{eq:{student_id:state.profile.id},order:'created_at',asc:false}),q('courses',{eq:{institute_id:state.profile.institute_id},order:'created_at',asc:false}),q('exams',{eq:{institute_id:state.profile.institute_id},order:'created_at',asc:false}),q('timetables',{eq:{institute_id:state.profile.institute_id},order:'weekday',asc:true})]);
      state.data.notices=n.data||[];state.data.homework=h.data||[];state.data.materials=m.data||[];state.data.courses=c.data||[];state.data.exams=e.data||[];state.data.timetable=t.data||[];
      const {data:st}=await sb.from('students').select('*').eq('profile_id',state.profile.id).maybeSingle();state.data.me=st;
    }
  }catch(e){toast(e.message)}
}
function renderAuth(){
 document.getElementById('root').innerHTML=`<div class="auth"><div class="auth-box"><div class="auth-brand"><div class="circle">V</div><div style="font-size:25px;font-weight:900;margin-top:9px;letter-spacing:.2px">VidyaDesk</div><div style="opacity:.9">Simple Digital Classroom & Tuition Manager</div></div><div class="role-tabs">${['admin','teacher','student'].map(r=>`<button class="${state.role===r?'active':''}" onclick="state.role='${r}';renderAuth()">${r[0].toUpperCase()+r.slice(1)}</button>`).join('')}</div>${sb?'':'<div class="hint"><b>Supabase setup required.</b><br>Use the settings button below or save your Project URL + Publishable key in browser storage.</div>'}<div class="section-title"><h1>${state.role[0].toUpperCase()+state.role.slice(1)} Login</h1></div><div class="form-grid"><div class="full"><label class="label">Email / Login ID</label><input id="loginEmail" class="input" placeholder="name@example.com or login ID" /></div><div class="full"><label class="label">Password</label><input id="loginPass" class="input" type="password" placeholder="Password" /></div></div><div class="login-actions" style="margin-top:12px"><button class="btn" style="flex:1" onclick="login()">Login as ${state.role}</button><button class="btn secondary" onclick="openConfig()">⚙</button></div><div style="text-align:center;margin-top:12px;font-size:13px">First time? <a class="link" href="#" onclick="event.preventDefault();openRegister()">Create account</a></div><div class="footer-note">VidyaDesk • Admin + Teacher + Student</div></div></div>`;
}
function openConfig(){openModal(`<div class="section-title"><h1>Supabase Configuration</h1><div class="spacer"></div><button class="btn secondary" onclick="closeModal()">Close</button></div><div class="hint">Use the Supabase <b>Project URL</b> and <b>Publishable key</b>. Do not put a secret/service-role key in this HTML.</div><div class="form-grid"><div class="full"><label class="label">Project URL</label><input id="cfgUrl" class="input" value="${esc(CONFIG.url==='YOUR_SUPABASE_URL'?'':CONFIG.url)}" /></div><div class="full"><label class="label">Publishable key</label><input id="cfgKey" class="input" value="${esc(CONFIG.key==='YOUR_SUPABASE_PUBLISHABLE_KEY'?'':CONFIG.key)}" /></div></div><div style="margin-top:12px"><button class="btn" onclick="saveConfig()">Save & Reload</button></div>`)}
function saveConfig(){localStorage.setItem('vd_supabase_url',document.getElementById('cfgUrl').value.trim());localStorage.setItem('vd_supabase_key',document.getElementById('cfgKey').value.trim());location.reload()}
function openRegister(){openModal(`<div class="section-title"><h1>Create account</h1><div class="spacer"></div><button class="btn secondary" onclick="closeModal()">Close</button></div><div class="hint">Create a Supabase Auth account first. Admin can then manage/assign the user's VidyaDesk role and institute.</div><div class="form-grid"><div class="full"><label class="label">Full name</label><input id="rgName" class="input"></div><div><label class="label">Email</label><input id="rgEmail" class="input"></div><div><label class="label">Password</label><input id="rgPass" class="input" type="password"></div></div><div style="margin-top:12px"><button class="btn" onclick="register()">Register</button></div>`)}
async function register(){if(!sb)return toast('Configure Supabase first');try{const {data,error}=await sb.auth.signUp({email:document.getElementById('rgEmail').value.trim(),password:document.getElementById('rgPass').value,options:{data:{full_name:document.getElementById('rgName').value.trim()}}});if(error)throw error;if(data.user){toast('Account created. If email confirmation is enabled, confirm your email.');closeModal();state.role='student';renderAuth()}}catch(e){toast(e.message)}}
async function login(){if(!sb)return toast('Configure Supabase first');try{const email=document.getElementById('loginEmail').value.trim();const password=document.getElementById('loginPass').value;const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;state.session=data.session;const {data:profile}=await sb.from('profiles').select('*').eq('id',data.user.id).maybeSingle();if(!profile)throw new Error('Profile not found. Ask Admin to create/assign your VidyaDesk profile.');state.profile=profile;state.role=profile.role||'student';if(profile.institute_id){const {data:inst}=await sb.from('institutes').select('*').eq('id',profile.institute_id).maybeSingle();state.institute=inst}await loadCore();render()}catch(e){toast(e.message)}}
async function logout(){if(sb)await sb.auth.signOut();state.session=null;state.profile=null;state.institute=null;renderAuth()}

function shell(content){
 const role=state.role; const menu=role==='admin'?[
 ['dashboard','Dashboard'],['students','Students'],['teachers','Teachers'],['batches','Batches'],['fees','Fees'],['attendance','Attendance'],['homework','Homework'],['notices','Notices'],['materials','Study Material'],['courses','Online Courses'],['exams','Online Exam'],['leads','Leads / Enquiry'],['reports','Reports'],['settings','Settings']
 ]:role==='teacher'?
 [['dashboard','Dashboard'],['batches','My Batches'],['attendance','Attendance'],['homework','Homework'],['materials','Study Material'],['courses','Online Courses'],['exams','Online Exam'],['notices','Notices'],['profile','My Profile']]
 :[['dashboard','Dashboard'],['profile','My Profile'],['notices','Notices'],['fees','Fees'],['attendance','Attendance'],['reports','Marks / Results'],['homework','Homework'],['materials','Study Material'],['timetable','Timetable'],['courses','Online Courses'],['exams','Online Exam']];
 return `<div class="app"><div class="topbar"><button class="iconbtn" onclick="toggleDrawer()">☰</button><div class="title app-brand-text" aria-label="VidyaDesk">VidyaDesk</div><button class="iconbtn" onclick="go('settings')">⚙</button><button class="iconbtn" onclick="logout()">↪</button></div><div class="layout"><aside class="sidebar"><div class="brand"><div class="logo" aria-hidden="true">V</div><div class="brand-name">VidyaDesk</div><small>${role[0].toUpperCase()+role.slice(1)} panel</small><div style="clear:both"></div></div><nav class="nav">${menu.map(([p,l])=>`<button class="${state.page===p?'active':''}" onclick="go('${p}')"><span>${icons[p]||'•'}</span>${l}</button>`).join('')}</nav><div class="footer-note">${esc(state.profile?.full_name||'User')}<br><a href="#" class="link" onclick="event.preventDefault();logout()">Logout</a></div></aside><main class="main"><div class="page">${content}</div></main></div><div class="mobile-nav"></div></div>`;
}
function toggleDrawer(){const role=state.role;const menu=role==='admin'?[['dashboard','Dashboard'],['students','Students'],['teachers','Teachers'],['batches','Batches'],['fees','Fees'],['attendance','Attendance'],['homework','Homework'],['notices','Notices'],['materials','Study Material'],['courses','Online Courses'],['exams','Online Exam'],['leads','Leads / Enquiry'],['reports','Reports'],['settings','Settings']]:role==='teacher'?[['dashboard','Dashboard'],['batches','My Batches'],['attendance','Attendance'],['homework','Homework'],['materials','Study Material'],['courses','Online Courses'],['exams','Online Exam'],['notices','Notices'],['profile','My Profile']]:[['dashboard','Dashboard'],['profile','My Profile'],['notices','Notices'],['fees','Fees'],['attendance','Attendance'],['reports','Marks / Results'],['homework','Homework'],['materials','Study Material'],['timetable','Timetable'],['courses','Online Courses'],['exams','Online Exam']];openDrawer(`<div class="brand"><div class="logo" aria-hidden="true">V</div><div class="brand-name">VidyaDesk</div><small>${role}</small><div style="clear:both"></div></div><div class="nav">${menu.map(([p,l])=>`<button onclick="closeDrawer();go('${p}')">${icons[p]||'•'} ${l}</button>`).join('')}</div><hr><button class="btn secondary" style="width:100%" onclick="logout()">Logout</button>`)}

function render(){if(!state.session||!state.profile){renderAuth();return}let html='';switch(state.page){case'dashboard':html=dashboardPage();break;case'students':html=studentsPage();break;case'teachers':html=teachersPage();break;case'batches':html=batchesPage();break;case'fees':html=feesPage();break;case'attendance':html=attendancePage();break;case'homework':html=homeworkPage();break;case'notices':html=noticesPage();break;case'materials':html=materialsPage();break;case'courses':html=coursesPage();break;case'exams':html=examsPage();break;case'leads':html=leadsPage();break;case'reports':html=reportsPage();break;case'profile':html=profilePage();break;case'timetable':html=timetablePage();break;case'settings':html=settingsPage();break;default:html=dashboardPage()}document.getElementById('root').innerHTML=shell(html)}

function dashboardPage(){if(state.role==='student')return studentDashboard();if(state.role==='teacher')return teacherDashboard();const students=state.data.students,fees=state.data.fees;const collected=fees.reduce((s,f)=>s+Number(f.amount_paid||0),0),pending=fees.reduce((s,f)=>s+Math.max(Number(f.amount_due||0)-Number(f.amount_paid||0),0),0);return `<div class="hero"><div style="opacity:.9">${esc(state.profile.full_name||'')} • Admin Dashboard</div><div class="big">Welcome to VidyaDesk</div><div style="margin-top:6px;opacity:.95">Manage students, fees, attendance, courses and exams from one place.</div></div><div class="section-title"><h1>Business Snapshot</h1></div><div class="grid grid-4"><div class="card"><div class="muted">Active Students</div><div class="metric">${students.filter(s=>s.status==='active').length}</div></div><div class="card"><div class="muted">Collected</div><div class="metric">₹${collected.toLocaleString('en-IN')}</div></div><div class="card"><div class="muted">Pending Dues</div><div class="metric">₹${pending.toLocaleString('en-IN')}</div></div><div class="card"><div class="muted">Leads</div><div class="metric">${state.data.leads.length}</div></div></div><div class="section-title"><h1>Quick Actions</h1></div><div class="quick">${[['students','👨‍🎓','Add Student'],['fees','₹','Collect Fee'],['attendance','✓','Take Attendance'],['courses','▶','Create Course'],['exams','☑','Create Exam'],['notices','🔔','Post Notice'],['homework','📝','Add Homework'],['leads','📞','Add Enquiry']].map(([p,i,t])=>`<button onclick="go('${p}')"><div class="ico">${i}</div>${t}</button>`).join('')}</div>`}
function teacherDashboard(){return `<div class="hero"><div style="opacity:.9">Teacher Dashboard</div><div class="big">Namaste, ${esc(state.profile.full_name||'Teacher')}</div><div style="margin-top:6px">Manage your assigned batches, attendance, homework, courses and exams.</div></div><div class="section-title"><h1>My Modules</h1></div><div class="quick">${[['batches','👥','My Batches'],['attendance','✓','Attendance'],['homework','📝','Homework'],['materials','📚','Study Material'],['courses','▶','Online Courses'],['exams','☑','Online Exam'],['notices','🔔','Notices'],['profile','👤','My Profile']].map(([p,i,t])=>`<button onclick="go('${p}')"><div class="ico">${i}</div>${t}</button>`).join('')}</div><div class="section-title"><h1>Recent Homework</h1></div>${state.data.homework.length?`<div class="list">${state.data.homework.slice(0,5).map(h=>`<div class="list-item"><div class="grow"><b>${esc(h.title)}</b><div class="muted">Due: ${esc(h.due_date||'—')}</div></div><span class="badge ${h.status==='done'?'paid':'pending'}">${esc(h.status||'pending')}</span></div>`).join('')}</div>`:`<div class="empty card">No homework yet.</div>`}`}
function studentDashboard(){return `<div class="section-title"><h1>Namaste, ${esc(state.profile.full_name||'student')}</h1></div><div class="student-grid">${[['profile','👤','My Profile'],['notices','🔔','Notices'],['fees','▤','Fees'],['attendance','✓','Attendance'],['reports','★','Marks / Results'],['homework','📝','Homework'],['materials','📚','Study Material'],['timetable','🗓','Timetable'],['courses','▶','Online Courses'],['exams','☑','Online Exam']].map(([p,i,t])=>`<button onclick="go('${p}')"><span class="ico">${i}</span>${t}</button>`).join('')}</div>`}

function studentsPage(){const rows=state.data.students||[];return `<div class="section-title"><h1>Students</h1><div class="spacer"></div>${state.role==='admin'?`<button class="btn" onclick="studentForm()">+ Add Student</button>`:''}</div><div class="toolbar"><input id="studentSearch" class="input" placeholder="Search student..." oninput="filterRows('student')"></div><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Student ID</th><th>Mobile</th><th>Batch</th><th>Status</th><th></th></tr></thead><tbody id="studentTbody">${rows.map(s=>studentRow(s)).join('')}</tbody></table></div>`}
function studentRow(s){const b=state.data.batches.find(x=>x.id===s.batch_id);return `<tr data-search="${esc((s.full_name+' '+s.student_code+' '+(s.mobile||'')).toLowerCase())}"><td><b>${esc(s.full_name)}</b><div class="muted">${esc(s.guardian_name||'')}</div></td><td>${esc(s.student_code||'')}</td><td>${esc(s.mobile||'')}</td><td>${esc(b?.name||'—')}</td><td><span class="badge ${s.status==='active'?'active':'inactive'}">${esc(s.status||'active')}</span></td><td>${state.role==='admin'?`<button class="btn secondary small" onclick='editStudent(${JSON.stringify(s)})'>Manage</button>`:''}</td></tr>`}
function filterRows(kind){const val=document.getElementById(kind+'Search')?.value.toLowerCase()||'';document.querySelectorAll('#'+kind+'Tbody tr').forEach(r=>r.style.display=r.dataset.search.includes(val)?'':'none')}
function studentForm(existing){const s=existing||{};openModal(`<div class="section-title"><h1>${s.id?'Edit':'Add'} Student</h1><div class="spacer"></div><button class="btn secondary" onclick="closeModal()">Close</button></div><div class="form-grid"><div><label class="label">Student Name *</label><input id="f_name" class="input" value="${esc(s.full_name||'')}"></div><div><label class="label">Student ID</label><input id="f_code" class="input" value="${esc(s.student_code||('STU'+String(Date.now()).slice(-5)))}"></div><div><label class="label">Guardian Name *</label><input id="f_guardian" class="input" value="${esc(s.guardian_name||'')}"></div><div><label class="label">Mobile *</label><input id="f_mobile" class="input" value="${esc(s.mobile||'')}"></div><div><label class="label">Date of Birth</label><input id="f_dob" class="input" type="date" value="${esc(s.dob||'')}"></div><div><label class="label">Gender</label><select id="f_gender" class="select"><option value="">Select</option><option ${s.gender==='Male'?'selected':''}>Male</option><option ${s.gender==='Female'?'selected':''}>Female</option><option ${s.gender==='Other'?'selected':''}>Other</option></select></div><div><label class="label">Blood Group</label><input id="f_blood" class="input" value="${esc(s.blood_group||'')}"></div><div><label class="label">Batch</label><select id="f_batch" class="select"><option value="">Select batch</option>${state.data.batches.map(b=>`<option value="${b.id}" ${s.batch_id===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div><div class="full"><label class="label">Address</label><textarea id="f_address" class="textarea" rows="3">${esc(s.address||'')}</textarea></div></div><div class="login-actions" style="margin-top:12px"><button class="btn" onclick="saveStudent('${s.id||''}')">Save Student</button>${s.id?`<button class="btn warning" onclick="toggleStudent('${s.id}','${s.status==='active'?'inactive':'active'}')">${s.status==='active'?'Deactivate':'Activate'}</button>`:''}</div>`)}
function editStudent(s){studentForm(s)}
async function saveStudent(id){try{const row={institute_id:state.profile.institute_id,full_name:document.getElementById('f_name').value.trim(),student_code:document.getElementById('f_code').value.trim(),guardian_name:document.getElementById('f_guardian').value.trim(),mobile:document.getElementById('f_mobile').value.trim(),dob:document.getElementById('f_dob').value||null,gender:document.getElementById('f_gender').value||null,blood_group:document.getElementById('f_blood').value.trim()||null,batch_id:document.getElementById('f_batch').value||null,address:document.getElementById('f_address').value.trim()||null,status:'active'};if(id)await update('students',id,row);else await insert('students',row);toast('Student saved');closeModal();await loadCore();render()}catch(e){toast(e.message)}}
async function toggleStudent(id,status){try{await update('students',id,{status});toast('Student updated');closeModal();await loadCore();render()}catch(e){toast(e.message)}}

function teachersPage(){const rows=state.data.teachers||[];return `<div class="section-title"><h1>Teachers</h1><div class="spacer"></div><button class="btn" onclick="teacherForm()">+ Add Teacher Profile</button></div><div class="list">${rows.length?rows.map(t=>`<div class="list-item"><div class="avatar">${esc((t.full_name||'T').charAt(0).toUpperCase())}</div><div class="grow"><b>${esc(t.full_name)}</b><div class="muted">${esc(t.employee_code||'')} • ${esc(t.subject||'')}</div></div><span class="badge ${t.status==='active'?'active':'inactive'}">${esc(t.status||'active')}</span></div>`).join(''):`<div class="empty card">No teacher profiles yet. Teacher Auth accounts can be attached to profiles using the SQL policy/admin workflow.</div>`}</div>`}
function teacherForm(){openModal(`<div class="section-title"><h1>Teacher Profile</h1><div class="spacer"></div><button class="btn secondary" onclick="closeModal()">Close</button></div><div class="form-grid"><div><label class="label">Full Name</label><input id="t_name" class="input"></div><div><label class="label">Employee Code</label><input id="t_code" class="input" value="TEA${String(Date.now()).slice(-5)}"></div><div><label class="label">Subject</label><input id="t_subject" class="input"></div><div><label class="label">Mobile</label><input id="t_mobile" class="input"></div></div><div style="margin-top:12px"><button class="btn" onclick="saveTeacherProfile()">Save</button></div>`)}
async function saveTeacherProfile(){try{await insert('teachers',{institute_id:state.profile.institute_id,full_name:document.getElementById('t_name').value.trim(),employee_code:document.getElementById('t_code').value.trim(),subject:document.getElementById('t_subject').value.trim(),mobile:document.getElementById('t_mobile').value.trim(),status:'active'});toast('Teacher profile created');closeModal();await loadCore();render()}catch(e){toast(e.message)}}

function batchesPage(){return `<div class="section-title"><h1>Batches</h1><div class="spacer"></div>${state.role==='admin'?`<button class="btn" onclick="batchForm()">+ Add Batch</button>`:''}</div><div class="grid grid-3">${(state.data.batches||[]).map(b=>`<div class="card"><h3>${esc(b.name)}</h3><div class="muted">${esc(b.course_name||'')} • ${esc(b.schedule||'')}</div><div style="margin-top:10px"><span class="badge info">${esc(b.status||'active')}</span></div></div>`).join('')||'<div class="empty card">No batches yet.</div>'}</div>`}
function batchForm(){openModal(`<div class="section-title"><h1>Add Batch</h1><div class="spacer"></div><button class="btn secondary" onclick="closeModal()">Close</button></div><div class="form-grid"><div><label class="label">Batch Name</label><input id="b_name" class="input"></div><div><label class="label">Course / Class</label><input id="b_course" class="input"></div><div><label class="label">Schedule</label><input id="b_schedule" class="input" placeholder="Mon-Wed-Fri 5:00 PM"></div><div><label class="label">Fee / Month</label><input id="b_fee" class="input" type="number" value="0"></div></div><div style="margin-top:12px"><button class="btn" onclick="saveBatch()">Save Batch</button></div>`)}
async function saveBatch(){try{await insert('batches',{institute_id:state.profile.institute_id,name:document.getElementById('b_name').value.trim(),course_name:document.getElementById('b_course').value.trim(),schedule:document.getElementById('b_schedule').value.trim(),monthly_fee:Number(document.getElementById('b_fee').value||0),status:'active'});toast('Batch saved');closeModal();await loadCore();render()}catch(e){toast(e.message)}}

function feesPage(){if(state.role==='student')return studentFees();const rows=state.data.fees||[];const totalDue=rows.reduce((s,f)=>s+Number(f.amount_due||0),0),paid=rows.reduce((s,f)=>s+Number(f.amount_paid||0),0);return `<div class="section-title"><h1>Fees</h1><div class="spacer"></div><button class="btn" onclick="feeForm()">+ Collect Fee</button></div><div class="grid grid-3"><div class="card"><div class="muted">Total Due</div><div class="metric">₹${totalDue.toLocaleString('en-IN')}</div></div><div class="card"><div class="muted">Collected</div><div class="metric">₹${paid.toLocaleString('en-IN')}</div></div><div class="card"><div class="muted">Pending</div><div class="metric">₹${Math.max(totalDue-paid,0).toLocaleString('en-IN')}</div></div></div><div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Student</th><th>Month</th><th>Due</th><th>Paid</th><th>Status</th><th>Receipt</th></tr></thead><tbody>${rows.map(f=>`<tr><td>${esc(f.student_name||f.student_id||'')}</td><td>${esc(f.fee_month||'')}</td><td>₹${Number(f.amount_due||0).toLocaleString('en-IN')}</td><td>₹${Number(f.amount_paid||0).toLocaleString('en-IN')}</td><td><span class="badge ${f.status==='paid'?'paid':'pending'}">${esc(f.status||'pending')}</span></td><td><button class="btn secondary small" onclick='printReceipt(${JSON.stringify(f)})'>PDF/Print</button></td></tr>`).join('')}</tbody></table></div>`}
function studentFees(){const m=state.data.me||{};return `<div class="section-title"><h1>Fees</h1></div><div class="grid grid-2"><div class="card"><div class="muted">Student</div><div class="metric" style="font-size:20px">${esc(m.full_name||state.profile.full_name||'')}</div></div><div class="card"><div class="muted">Status</div><div class="metric" style="font-size:20px">${esc(m.status||'active')}</div></div></div><div class="card" style="margin-top:12px"><h3>Fee History</h3><div class="empty">Fee rows linked to your profile will appear here.</div></div>`}
function feeForm(){openModal(`<div class="section-title"><h1>Collect Fee</h1><div class="spacer"></div><button class="btn secondary" onclick="closeModal()">Close</button></div><div class="form-grid"><div class="full"><label class="label">Student</label><select id="fee_student" class="select">${state.data.students.map(s=>`<option value="${s.id}">${esc(s.full_name)} • ${esc(s.student_code||'')}</option>`).join('')}</select></div><div><label class="label">Fee Month</label><input id="fee_month" class="input" type="month" value="${new Date().toISOString().slice(0,7)}"></div><div><label class="label">Amount Due</label><input id="fee_due" class="input" type="number" value="0"></div><div><label class="label">Amount Paid</label><input id="fee_paid" class="input" type="number" value="0"></div><div><label class="label">Payment Mode</label><select id="fee_mode" class="select"><option>Cash</option><option>UPI</option><option>Bank</option><option>Card</option></select></div></div><div style="margin-top:12px"><button class="btn" onclick="saveFee()">Save & Receipt</button></div>`)}
async function saveFee(){try{const s=state.data.students.find(x=>x.id===document.getElementById('fee_student').value);const due=Number(document.getElementById('fee_due').value||0),paid=Number(document.getElementById('fee_paid').value||0);const f=await insert('fees',{institute_id:state.profile.institute_id,student_id:s.id,student_name:s.full_name,fee_month:document.getElementById('fee_month').value,amount_due:due,amount_paid:paid,payment_mode:document.getElementById('fee_mode').value,status:paid>=due?'paid':'pending',receipt_no:'RCPT-'+Date.now().toString().slice(-7),paid_at:paid?new Date().toISOString():null});toast('Fee saved');closeModal();await loadCore();render();printReceipt(f)}catch(e){toast(e.message)}}
function printReceipt(f){const w=window.open('','_blank','width=700,height=700');if(!w)return;w.document.write(`<html><head><title>VidyaDesk Receipt</title><style>body{font-family:Arial;padding:30px}h1{color:#8f0d0d}.box{border:1px solid #ddd;padding:20px;border-radius:12px}table{width:100%;border-collapse:collapse}td{padding:8px;border-bottom:1px solid #eee}</style></head><body><h1>VidyaDesk</h1><div class="box"><h2>Fee Receipt</h2><table><tr><td>Receipt</td><td>${esc(f.receipt_no||'')}</td></tr><tr><td>Student</td><td>${esc(f.student_name||'')}</td></tr><tr><td>Month</td><td>${esc(f.fee_month||'')}</td></tr><tr><td>Due</td><td>₹${Number(f.amount_due||0)}</td></tr><tr><td>Paid</td><td>₹${Number(f.amount_paid||0)}</td></tr><tr><td>Mode</td><td>${esc(f.payment_mode||'')}</td></tr></table></div><script>window.print()<\/script></body></html>`);w.document.close()}

function attendancePage(){if(state.role==='student')return `<div class="section-title"><h1>Attendance</h1></div><div class="card"><h3>Your attendance</h3><div class="metric">—</div><div class="muted">Attendance reports linked to your student profile will appear here.</div></div>`;return `<div class="section-title"><h1>Attendance</h1><div class="spacer"></div><button class="btn" onclick="attendanceForm()">Take Attendance</button></div><div class="grid grid-2"><div class="card"><h3>Student Attendance</h3><p class="muted">Mark Present / Absent by batch and date.</p><button class="btn secondary" onclick="attendanceForm()">Open Attendance</button></div><div class="card"><h3>Attendance Report</h3><p class="muted">View date-wise and student-wise attendance.</p><button class="btn secondary" onclick="go('reports')">Open Report</button></div></div>`}
function attendanceForm(){openModal(`<div class="section-title"><h1>Take Attendance</h1><div class="spacer"></div><button class="btn secondary" onclick="closeModal()">Close</button></div><div class="form-grid"><div><label class="label">Batch</label><select id="att_batch" class="select"><option value="">Select</option>${state.data.batches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div><div><label class="label">Date</label><input id="att_date" class="input" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div id="att_students" style="margin-top:12px" class="empty">Select a batch to load students.</div><div style="margin-top:12px"><button class="btn" onclick="saveAttendance()">Save Attendance</button></div>`);document.getElementById('att_batch').addEventListener('change',loadAttStudents)}
async function loadAttStudents(){const bid=document.getElementById('att_batch').value;const c=document.getElementById('att_students');if(!bid){c.innerHTML='Select a batch to load students.';return}const rows=state.data.students.filter(s=>s.batch_id===bid);c.className='list';c.innerHTML=rows.map(s=>`<label class="list-item"><div class="grow"><b>${esc(s.full_name)}</b><div class="muted">${esc(s.student_code||'')}</div></div><select class="select att-status" data-student="${s.id}" style="width:130px"><option>present</option><option>absent</option><option>late</option></select></label>`).join('')||'<div class="empty">No students in this batch.</div>'}
async function saveAttendance(){try{const batch=document.getElementById('att_batch').value,date=document.getElementById('att_date').value;const rows=[...document.querySelectorAll('.att-status')];for(const sel of rows){await insert('attendance',{institute_id:state.profile.institute_id,student_id:sel.dataset.student,batch_id:batch,date,status:sel.value,marked_by:state.profile.id})}toast('Attendance saved');closeModal()}catch(e){toast(e.message)}}

function homeworkPage(){if(state.role==='student')return `<div class="section-title"><h1>Homework</h1></div><div class="list">${state.data.homework.length?state.data.homework.map(h=>`<div class="list-item"><div class="grow"><b>${esc(h.title)}</b><div class="muted">${esc(h.description||'')} • Due ${esc(h.due_date||'')}</div></div><span class="badge pending">${esc(h.status||'pending')}</span></div>`).join(''):'<div class="empty card">No homework assigned.</div>'}</div>`;return `<div class="section-title"><h1>Homework</h1><div class="spacer"></div><button class="btn" onclick="homeworkForm()">+ Add Homework</button></div><div class="list">${state.data.homework.length?state.data.homework.map(h=>`<div class="list-item"><div class="grow"><b>${esc(h.title)}</b><div class="muted">${esc(h.description||'')} • Due ${esc(h.due_date||'')}</div></div></div>`).join(''):'<div class="empty card">No homework yet.</div>'}</div>`}
function homeworkForm(){openModal(`<div class="section-title"><h1>Add Homework</h1><div class="spacer"></div><button class="btn secondary" onclick="closeModal()">Close</button></div><div class="form-grid"><div class="full"><label class="label">Title</label><input id="hw_title" class="input"></div><div class="full"><label class="label">Description</label><textarea id="hw_desc" class="textarea" rows="4"></textarea></div><div><label class="label">Batch</label><select id="hw_batch" class="select"><option value="">All / Unspecified</option>${state.data.batches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div><div><label class="label">Due Date</label><input id="hw_due" class="input" type="date"></div></div><div style="margin-top:12px"><button class="btn" onclick="saveHomework()">Save</button></div>`)}
async function saveHomework(){try{await insert('homework',{institute_id:state.profile.institute_id,teacher_id:state.role==='teacher'?state.profile.id:null,title:document.getElementById('hw_title').value.trim(),description:document.getElementById('hw_desc').value.trim(),batch_id:document.getElementById('hw_batch').value||null,due_date:document.getElementById('hw_due').value||null,status:'pending'});toast('Homework added');closeModal();await loadCore();render()}catch(e){toast(e.message)}}

function noticesPage(){return `<div class="section-title"><h1>Notices</h1>${state.role!=='student'?`<div class="spacer"></div><button class="btn" onclick="noticeForm()">+ Post Notice</button>`:''}</div><div class="list">${state.data.notices.length?state.data.notices.map(n=>`<div class="card"><h3>${esc(n.title)}</h3><div>${esc(n.body||'')}</div><div class="muted" style="margin-top:8px">${new Date(n.created_at||Date.now()).toLocaleDateString('en-IN')}</div></div>`).join(''):'<div class="empty card">No notices.</div>'}</div>`}
function noticeForm(){openModal(`<div class="section-title"><h1>Post Notice</h1><div class="spacer"></div><button class="btn secondary" onclick="closeModal()">Close</button></div><div class="form-grid"><div class="full"><label class="label">Title</label><input id="n_title" class="input"></div><div class="full"><label class="label">Message</label><textarea id="n_body" class="textarea" rows="5"></textarea></div></div><div style="margin-top:12px"><button class="btn" onclick="saveNotice()">Post Notice</button></div>`)}
async function saveNotice(){try{await insert('notices',{institute_id:state.profile.institute_id,author_id:state.profile.id,title:document.getElementById('n_title').value.trim(),body:document.getElementById('n_body').value.trim(),audience:'all'});toast('Notice posted');closeModal();await loadCore();render()}catch(e){toast(e.message)}}

function materialsPage(){return `<div class="section-title"><h1>Study Material</h1>${state.role!=='student'?`<div class="spacer"></div><button class="btn" onclick="materialForm()">+ Add Material</button>`:''}</div><div class="grid grid-3">${(state.data.materials||[]).map(m=>`<div class="card"><h3>${esc(m.title)}</h3><div class="muted">${esc(m.material_type||'file')} • ${esc(m.file_url||'')}</div>${m.file_url?`<div style="margin-top:10px"><a class="btn secondary small" href="${esc(m.file_url)}" target="_blank">Open</a></div>`:''}</div>`).join('')||'<div class="empty card">No study material.</div>'}</div>`}
function materialForm(){openModal(`<div class="section-title"><h1>Add Study Material</h1><div class="spacer"></div><button class="btn secondary" onclick="closeModal()">Close</button></div><div class="form-grid"><div><label class="label">Title</label><input id="m_title" class="input"></div><div><label class="label">Type</label><select id="m_type" class="select"><option>PDF</option><option>Video</option><option>Link</option><option>Note</option></select></div><div class="full"><label class="label">File / Video URL</label><input id="m_url" class="input" placeholder="https://..."></div></div><div style="margin-top:12px"><button class="btn" onclick="saveMaterial()">Save</button></div>`)}
async function saveMaterial(){try{await insert('study_materials',{institute_id:state.profile.institute_id,teacher_id:state.role==='teacher'?state.profile.id:null,title:document.getElementById('m_title').value.trim(),material_type:document.getElementById('m_type').value,file_url:document.getElementById('m_url').value.trim()});toast('Material saved');closeModal();await loadCore();render()}catch(e){toast(e.message)}}

function coursesPage(){return `<div class="section-title"><h1>Online Courses</h1>${state.role!=='student'?`<div class="spacer"></div><button class="btn" onclick="courseForm()">+ Create Course</button>`:''}</div><div class="grid grid-3">${(state.data.courses||[]).map(c=>`<div class="course-card"><div class="course-head"><span class="badge info">ONLINE</span><h3 style="margin-top:8px">${esc(c.title)}</h3><div class="muted">${esc(c.description||'')}</div></div><div class="course-body"><button class="btn secondary small" onclick="courseView('${c.id}')">Open Course</button></div></div>`).join('')||'<div class="empty card">No courses yet.</div>'}</div>`}
function courseForm(){openModal(`<div class="section-title"><h1>Create Course</h1><div class="spacer"></div><button class="btn secondary" onclick="closeModal()">Close</button></div><div class="form-grid"><div class="full"><label class="label">Course Title</label><input id="c_title" class="input"></div><div class="full"><label class="label">Description</label><textarea id="c_desc" class="textarea" rows="4"></textarea></div></div><div style="margin-top:12px"><button class="btn" onclick="saveCourse()">Create Course</button></div>`)}
async function saveCourse(){try{await insert('courses',{institute_id:state.profile.institute_id,teacher_id:state.role==='teacher'?state.profile.id:null,title:document.getElementById('c_title').value.trim(),description:document.getElementById('c_desc').value.trim(),status:'published'});toast('Course created');closeModal();await loadCore();render()}catch(e){toast(e.message)}}
async function courseView(id){const c=state.data.courses.find(x=>x.id===id);const {data:lessons}=await q('course_lessons',{eq:{course_id:id},order:'position'});openModal(`<div class="section-title"><h1>${esc(c?.title||'Course')}</h1><div class="spacer"></div><button class="btn secondary" onclick="closeModal()">Close</button></div><p class="muted">${esc(c?.description||'')}</p><div class="list">${(lessons||[]).map(l=>`<div class="list-item"><div class="grow"><b>${esc(l.title)}</b><div class="muted">${esc(l.lesson_type||'Lesson')}</div></div>${l.content_url?`<a class="btn secondary small" href="${esc(l.content_url)}" target="_blank">Open</a>`:''}</div>`).join('')||'<div class="empty">No lessons added yet.</div>'}</div>`)}

function examsPage(){if(state.role==='student')return studentExamList();return `<div class="section-title"><h1>Online Exam</h1><div class="spacer"></div><button class="btn" onclick="examForm()">+ Create Exam</button></div><div class="list">${(state.data.exams||[]).map(e=>`<div class="card"><div style="display:flex;align-items:center;gap:10px"><div class="grow"><h3>${esc(e.title)}</h3><div class="muted">${esc(e.description||'')} • Pass: ${esc(e.pass_percent||'35')}%</div></div><span class="badge info">${esc(e.status||'published')}</span></div></div>`).join('')||'<div class="empty card">No exams yet.</div>'}</div>`}
function studentExamList(){return `<div class="section-title"><h1>Online Exam</h1></div><div class="list">${(state.data.exams||[]).map(e=>`<div class="card"><h3>${esc(e.title)}</h3><div class="muted">${esc(e.description||'')}</div><div style="margin-top:10px"><button class="btn" onclick="takeExam('${e.id}')">Start Exam</button></div></div>`).join('')||'<div class="empty card">No exams available.</div>'}</div>`}
function examForm(){openModal(`<div class="section-title"><h1>Create Exam</h1><div class="spacer"></div><button class="btn secondary" onclick="closeModal()">Close</button></div><div class="form-grid"><div class="full"><label class="label">Exam Title</label><input id="e_title" class="input"></div><div class="full"><label class="label">Description</label><textarea id="e_desc" class="textarea" rows="3"></textarea></div><div><label class="label">Pass %</label><input id="e_pass" class="input" type="number" value="35"></div><div><label class="label">Duration (min)</label><input id="e_dur" class="input" type="number" value="30"></div></div><div style="margin-top:12px"><button class="btn" onclick="saveExam()">Create Exam</button></div>`)}
async function saveExam(){try{await insert('exams',{institute_id:state.profile.institute_id,teacher_id:state.role==='teacher'?state.profile.id:null,title:document.getElementById('e_title').value.trim(),description:document.getElementById('e_desc').value.trim(),pass_percent:Number(document.getElementById('e_pass').value||35),duration_minutes:Number(document.getElementById('e_dur').value||30),status:'published'});toast('Exam created');closeModal();await loadCore();render()}catch(e){toast(e.message)}}
async function takeExam(id){const ex=state.data.exams.find(e=>e.id===id);const {data:qs}=await q('exam_questions',{eq:{exam_id:id},order:'position'});openModal(`<div class="section-title"><h1>${esc(ex.title)}</h1><div class="spacer"></div></div><div class="hint">Answer all questions and submit. Attempt limit: 1.</div>${(qs||[]).map((x,i)=>`<div class="question"><b>Q${i+1}. ${esc(x.question_text)} <span class="muted">[${x.marks||1} mark]</span></b>${['option_a','option_b','option_c','option_d'].map(k=>x[k]?`<label class="option"><input type="radio" name="q_${x.id}" value="${esc(k)}"> <span>${esc(x[k])}</span></label>`:'').join('')}</div>`).join('')||'<div class="empty">No questions configured for this exam.</div>'}<button class="btn" onclick="submitExam('${id}')">Submit Exam</button>`)}
async function submitExam(id){try{const {data:qs}=await q('exam_questions',{eq:{exam_id:id}});let score=0,total=0;for(const qx of qs||[]){total+=Number(qx.marks||1);const ans=document.querySelector(`input[name="q_${qx.id}"]:checked`)?.value;if(ans&&ans===qx.correct_option)score+=Number(qx.marks||1)}await insert('exam_attempts',{exam_id:id,student_id:state.profile.id,score,total_marks:total,percentage:total?(score/total*100):0,status:'submitted',submitted_at:new Date().toISOString()});toast(`Exam submitted • ${score}/${total}`);closeModal()}catch(e){toast(e.message)}}

function leadsPage(){if(state.role!=='admin')return `<div class="section-title"><h1>Access denied</h1></div><div class="empty card">Leads are visible to Admin only.</div>`;return `<div class="section-title"><h1>Leads / Enquiry</h1><div class="spacer"></div><button class="btn" onclick="leadForm()">+ Add Enquiry</button></div><div class="list">${state.data.leads.map(l=>`<div class="list-item"><div class="grow"><b>${esc(l.name)}</b><div class="muted">${esc(l.mobile||'')} • ${esc(l.source||'Walk-in')}</div></div><span class="badge info">${esc(l.status||'new')}</span></div>`).join('')||'<div class="empty card">No leads yet.</div>'}</div>`}
function leadForm(){openModal(`<div class="section-title"><h1>Add Enquiry</h1><div class="spacer"></div><button class="btn secondary" onclick="closeModal()">Close</button></div><div class="form-grid"><div><label class="label">Name</label><input id="l_name" class="input"></div><div><label class="label">Mobile</label><input id="l_mobile" class="input"></div><div><label class="label">Source</label><input id="l_source" class="input" value="Walk-in"></div><div><label class="label">Course Interested</label><input id="l_course" class="input"></div></div><div style="margin-top:12px"><button class="btn" onclick="saveLead()">Save</button></div>`)}
async function saveLead(){try{await insert('leads',{institute_id:state.profile.institute_id,name:document.getElementById('l_name').value.trim(),mobile:document.getElementById('l_mobile').value.trim(),source:document.getElementById('l_source').value.trim(),course_interested:document.getElementById('l_course').value.trim(),status:'new'});toast('Enquiry saved');closeModal();await loadCore();render()}catch(e){toast(e.message)}}

function reportsPage(){if(state.role==='student')return `<div class="section-title"><h1>Marks / Results</h1></div><div class="card"><h3>Exam Results</h3><div class="empty">Submitted exam results will appear here.</div></div>`;return `<div class="section-title"><h1>Reports</h1></div><div class="grid grid-3"><div class="card"><h3>Student Report</h3><div class="muted">Student list and status summary.</div><button class="btn secondary small" style="margin-top:10px" onclick="go('students')">Open</button></div><div class="card"><h3>Fee Report</h3><div class="muted">Collection and pending dues.</div><button class="btn secondary small" style="margin-top:10px" onclick="go('fees')">Open</button></div><div class="card"><h3>Attendance Report</h3><div class="muted">Date-wise attendance.</div><button class="btn secondary small" style="margin-top:10px" onclick="attendanceReport()">Open</button></div></div>`}
function attendanceReport(){openModal(`<div class="section-title"><h1>Attendance Report</h1><div class="spacer"></div><button class="btn secondary" onclick="closeModal()">Close</button></div><div class="empty">Use the Attendance module to filter by batch/date. The SQL schema already supports date-wise reporting.</div>`)}
function profilePage(){return `<div class="section-title"><h1>My Profile</h1></div><div class="card"><div class="list-item"><div class="avatar">${esc((state.profile.full_name||'U').charAt(0).toUpperCase())}</div><div class="grow"><b>${esc(state.profile.full_name||'')}</b><div class="muted">${esc(state.profile.email||state.session?.user?.email||'')} • ${esc(state.role)}</div></div></div><div style="margin-top:12px" class="form-grid"><div><label class="label">Mobile</label><input class="input" value="${esc(state.profile.mobile||'')}" disabled></div><div><label class="label">Status</label><input class="input" value="${esc(state.profile.status||'active')}" disabled></div></div></div>`}
function timetablePage(){return `<div class="section-title"><h1>Timetable</h1></div><div class="table-wrap"><table class="table"><thead><tr><th>Day</th><th>Start</th><th>End</th><th>Batch</th><th>Subject</th><th>Room</th></tr></thead><tbody>${(state.data.timetable||[]).map(t=>`<tr><td>${esc(t.weekday)}</td><td>${esc(t.start_time||'')}</td><td>${esc(t.end_time||'')}</td><td>${esc(t.batch_name||'')}</td><td>${esc(t.subject||'')}</td><td>${esc(t.room||'')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No timetable entries yet.</td></tr>'}</tbody></table></div>`}
function settingsPage(){if(state.role!=='admin')return `<div class="section-title"><h1>Settings</h1></div><div class="card"><p>Account and institute settings are controlled by Admin.</p></div>`;return `<div class="section-title"><h1>Settings</h1></div><div class="grid grid-2"><div class="card"><h3>Institute Profile</h3><div class="form-grid"><div class="full"><label class="label">Institute Name</label><input id="s_inst" class="input" value="${esc(state.institute?.name||'VidyaDesk Institute')}"></div><div><label class="label">Mobile</label><input id="s_mobile" class="input" value="${esc(state.institute?.mobile||'')}"></div><div><label class="label">City</label><input id="s_city" class="input" value="${esc(state.institute?.city||'')}"></div><div class="full"><label class="label">Address</label><textarea id="s_address" class="textarea" rows="3">${esc(state.institute?.address||'')}</textarea></div></div><button class="btn" style="margin-top:10px" onclick="saveInstitute()">Save Institute</button></div><div class="card"><h3>Supabase</h3><p class="muted">Change connection settings used by this browser.</p><button class="btn secondary" onclick="openConfig()">Open Supabase Config</button><div style="margin-top:12px" class="hint">Keep the publishable key only. Never paste service-role/secret keys into this HTML.</div></div></div>`}
async function saveInstitute(){try{await update('institutes',state.profile.institute_id,{name:document.getElementById('s_inst').value.trim(),mobile:document.getElementById('s_mobile').value.trim(),city:document.getElementById('s_city').value.trim(),address:document.getElementById('s_address').value.trim()});state.institute={...state.institute,name:document.getElementById('s_inst').value.trim(),mobile:document.getElementById('s_mobile').value.trim(),city:document.getElementById('s_city').value.trim(),address:document.getElementById('s_address').value.trim()};toast('Institute updated');render()}catch(e){toast(e.message)}}

document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.getElementById('drawer').addEventListener('click',e=>{if(e.target.id==='drawer')closeDrawer()});
bootstrap();
</script>
</body>
</html>
